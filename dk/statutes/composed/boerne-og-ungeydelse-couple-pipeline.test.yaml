# Companion fixtures for the composed couple (ligedeling) pipeline. Each
# Person row is one forældremyndighedsindehaver receiving half of each § 1
# PAYMENT (børneydelse quarterly, ungeydelse monthly per § 5, stk. 3-4),
# the half rounded upward per § 4, stk. 1, then tapered on the recipient's
# OWN income basis per § 1 a. 2025 band 1: annual 16.764, quarterly 4.191
# (odd), rounded-up half 2.096, per-recipient annual 4 x 2.096 = 8.384.
# 2026 band 1: annual 16.992, quarterly 4.248, half 2.124, annual 8.496.
# Allowances are the § 20-regulated bundfradrag (2025: 917.000; 2026:
# 961.100).
#
# The low-income-recipient case mirrors the statutory side of the July
# EUROMOD probe P4 (married single-earner couple): the earner's half tapers
# on own income while the non-earner's half survives untapered at 8.382 —
# EUROMOD DK_2025's pre-2022 spousal test disagrees by construction
# (ec-jrc#18).

- name: recipient_below_allowance_keeps_full_half_2025
  period:
    period_kind: tax_year
    start: '2025-06-01'
    end: '2025-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.child_age_years: 3
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.percentage_change_rounded_to_one_decimal_place
    : 0.285
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.payment_year_has_additional_statutory_increase
    : false
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis
    : 300000
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis_after_section_14_recalculation
    : 300000
    dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.person_only_taxable_part_of_year: false
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.total_contributions_to_qualifying_pension_accounts
    : 0
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.pension_contribution_limit_under_pensionsbeskatningsloven_section_16
    : 61200
    ? dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#input.current_year_income_reduction_allowance
    : 917000
  output:
    dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#equal_share_of_annual_child_youth_benefit: 8384
    dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#couple_recipient_annual_child_youth_benefit: 8384

- name: recipient_own_income_tapers_own_half_2025
  period:
    period_kind: tax_year
    start: '2025-06-01'
    end: '2025-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.child_age_years: 3
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.percentage_change_rounded_to_one_decimal_place
    : 0.285
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.payment_year_has_additional_statutory_increase
    : false
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis
    : 1017000
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis_after_section_14_recalculation
    : 1017000
    dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.person_only_taxable_part_of_year: false
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.total_contributions_to_qualifying_pension_accounts
    : 0
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.pension_contribution_limit_under_pensionsbeskatningsloven_section_16
    : 61200
    ? dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#input.current_year_income_reduction_allowance
    : 917000
  output:
    # own basis 1.017.000 exceeds 917.000 by 100.000; 2 pct. -> 2.000;
    # per-recipient share 8.384 - 2.000 = 6.384.
    dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#equal_share_of_annual_child_youth_benefit: 8384
    dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#couple_recipient_annual_child_youth_benefit: 6384

- name: recipient_taper_exhausts_own_half_2025
  period:
    period_kind: tax_year
    start: '2025-06-01'
    end: '2025-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.child_age_years: 3
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.percentage_change_rounded_to_one_decimal_place
    : 0.285
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1#input.payment_year_has_additional_statutory_increase
    : false
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis
    : 1417000
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis_after_section_14_recalculation
    : 1417000
    dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.person_only_taxable_part_of_year: false
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.total_contributions_to_qualifying_pension_accounts
    : 0
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.pension_contribution_limit_under_pensionsbeskatningsloven_section_16
    : 61200
    ? dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#input.current_year_income_reduction_allowance
    : 917000
  output:
    # own excess 500.000; 2 pct. -> 10.000 > the 8.384 share, floored at 0.
    dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#equal_share_of_annual_child_youth_benefit: 8384
    dk:statutes/composed/boerne-og-ungeydelse-couple-pipeline#couple_recipient_annual_child_youth_benefit: 0

