format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-12-a
    source_sha256: 085e805b069362862579ec6302ee85751096dd0104bbcc021d6426ab7d605295
  summary: Personer og deres familiemedlemmer med opholdsret for førstegangsarbejdssøgende,
    og personer med ret til ophold i op til 3 måneder uden administrative betingelser,
    kan alene få hjælp i forbindelse med hjemrejse.
inputs:
- name: person_has_right_of_residence_as_first_time_jobseeker_under_community_rules
  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_family_member_of_person_with_right_of_residence_as_first_time_jobseeker_under_community_rules
  entity: Person
  dtype: Boolean
  period: Month
- name: person_has_right_of_residence_without_administrative_conditions
  entity: Person
  dtype: Boolean
  period: Month
- name: person_residence_without_administrative_conditions_duration_months
  entity: Person
  dtype: Integer
  period: Month
- name: assistance_is_in_connection_with_return_home
  entity: Person
  dtype: Boolean
  period: Month
- name: person_has_right_of_residence_for_up_to_three_months_without_administrative_conditions
  entity: Person
  dtype: Boolean
  period: Month
rules:
- name: residence_without_administrative_conditions_maximum_months
  kind: parameter
  dtype: Integer
  source: Aktivloven § 12 a
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-12-a
          excerpt: ophold i op til 3 måneder uden administrative betingelser
  versions:
  - effective_from: '2025-06-30'
    formula: '3'
- name: assistance_limited_to_return_home
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Aktivloven § 12 a
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-12-a
          excerpt: kan alene få hjælp i forbindelse med hjemrejse
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-12-a
          excerpt: Personer og deres familiemedlemmer, som har ret til at opholde
            sig her i landet i medfør af de fællesskabsretlige regler om ophold for
            førstegangsarbejdssøgende
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-12-a
          excerpt: personer, der har ret til ophold i op til 3 måneder uden administrative
            betingelser
  versions:
  - effective_from: '2025-06-30'
    formula: "(\n  person_has_right_of_residence_as_first_time_jobseeker_under_community_rules\n\
      \  or person_is_family_member_of_person_with_right_of_residence_as_first_time_jobseeker_under_community_rules\n\
      \  or (\n    person_has_right_of_residence_without_administrative_conditions\n\
      \    and person_residence_without_administrative_conditions_duration_months\
      \ <= residence_without_administrative_conditions_maximum_months\n  )\n)\nand\
      \ assistance_is_in_connection_with_return_home"
