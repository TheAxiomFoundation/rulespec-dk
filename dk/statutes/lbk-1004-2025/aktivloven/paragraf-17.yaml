format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
    source_sha256: fc3e43ac59477ec9cbc084f473e0941b106ff4373d9ce6fd8bb71435bad0b320
  summary: '§ 17, stk. 1: "Kommunen yder et månedligt børnetillæg på 2.687 kr. (2024-niveau)"

    til personer, der modtager kontanthjælp efter § 16, og som har forsørgelsespligt

    over for et eller flere børn under 18 år. Stk. 2 requires residence in the Realm,

    subject to EU-/EØS-law and bilateral-agreement exceptions.'
rules:
- name: child_age_upper_limit
  kind: parameter
  dtype: Integer
  period: Month
  source: Aktivloven § 17, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
          excerpt: børn under 18 år
  versions:
  - effective_from: '2025-06-30'
    formula: '18'
- name: child_supplement_price_level_year
  kind: parameter
  dtype: Integer
  period: Year
  source: Aktivloven § 17, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
          excerpt: 2.687 kr. (2024-niveau)
  versions:
