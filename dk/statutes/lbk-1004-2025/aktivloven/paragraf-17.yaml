- name: monthly_child_supplement_amount
  kind: parameter
  dtype: Money
  period: Month
  unit: DKK
  source: Aktivloven § 17, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
          excerpt: et månedligt børnetillæg på 2.687 kr. (2024-niveau)
  versions:
  - effective_from: '2025-06-30'
    formula: '2687'
- name: child_supplement_entitlement
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Aktivloven § 17, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
          excerpt: modtager kontanthjælp efter § 16, og som har forsørgelsespligt
            over for et eller flere børn under 18 år
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
          excerpt: Dette gælder dog ikke for EU-/EØS-borgere, i det omfang disse efter
            EU-retten er berettiget til hjælpen, eller for personer, der er omfattet
            af bilaterale overenskomster.
  versions:
  - effective_from: '2025-06-30'
    formula: "person_receives_cash_assistance_under_section_16\nand person_has_maintenance_duty_for_child_under_18\n\
      and (\n  children_reside_in_the_realm\n  or person_is_eu_ees_citizen_entitled_to_assistance_under_eu_law\n\
      \  or person_is_covered_by_bilateral_agreement\n)"
- name: monthly_child_supplement
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: DKK
  source: Aktivloven § 17, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
          excerpt: Kommunen yder et månedligt børnetillæg på 2.687 kr.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-17
          excerpt: Retten til et børnetillæg er betinget af, at børnene opholder sig
            her i riget.
  versions:
  - effective_from: '2025-06-30'
    formula: 'if child_supplement_entitlement: monthly_child_supplement_amount else:
      0'
