- name: entitled_to_special_youth_supplement
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Aktivloven § 19, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-19
          excerpt: personer under 30 år, der modtager kontanthjælp efter § 16, stk.
            1, nr. 1 og 3, og som kommunen har visiteret aktivitetsparate
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-19
          excerpt: En person, der modtager kontanthjælp som forrevalidend, jf. kapitel
            6 c i denne lov og kapitel 21 i lov om en aktiv beskæftigelsesindsats,
            har ret til at modtage det særlige ungetillæg
  versions:
  - effective_from: '2025-06-30'
    formula: "age < under_30_age_upper_limit\nand (\n  (receives_cash_assistance_under_section_16_subsection_1_items_1_or_3\n\
      \  and municipality_has_assessed_person_as_activity_ready)\n  or receives_cash_assistance_as_prevalidation_participant\n\
      )"
- name: special_youth_supplement
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Month
  source: Aktivloven § 19, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-19
          excerpt: Det særlige ungetillæg udgør et månedligt beløb på
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-19
          excerpt: der ikke har forsørgelsespligt over for børn
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-19
          excerpt: der har forsørgelsespligt over for børn og modtager børnetillæg
            efter § 17
  versions:
  - effective_from: '2025-06-30'
    formula: 'if entitled_to_special_youth_supplement and age < under_25_age_upper_limit
      and not has_child_support_obligation: supplement_amount_under_25_without_child_support_obligation
      else: if entitled_to_special_youth_supplement and age >= age_25_lower_limit_without_child_support_obligation
      and age <= age_29_upper_limit_without_child_support_obligation and not has_child_support_obligation:
      supplement_amount_age_25_to_29_without_child_support_obligation else: if entitled_to_special_youth_supplement
      and age < under_30_age_upper_limit and has_child_support_obligation and receives_child_supplement_under_section_17:
      supplement_amount_with_child_support_obligation else: 0'
