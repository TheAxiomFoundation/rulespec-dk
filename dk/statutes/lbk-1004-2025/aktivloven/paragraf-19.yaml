format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-19
    source_sha256: e12c8acf86379543d221ced5793379ec4d05b32ccf9d6b6d0b4cd4e64812455f
  summary: '§ 19, stk. 1-3: Kommunen yder et særligt ungetillæg til aktivitetsparate
    kontanthjælpsmodtagere under 30 år. Forrevalidender har ret til tillægget. Det
    månedlige beløb er 1.000 kr. til personer under 25 år uden forsørgelsespligt,
    2.500 kr. til personer 25-29 år uden forsørgelsespligt og 2.500 kr. til personer
    under 30 år med forsørgelsespligt, som modtager børnetillæg efter § 17.'
