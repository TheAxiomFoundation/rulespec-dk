  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_not_yet_entitled_to_full_month_of_cash_assistance_under_sections_16_to_20
  entity: Person
  dtype: Boolean
  period: Month
- name: person_has_applied_for_one_time_assistance
  entity: Person
  dtype: Boolean
  period: Month
- name: assistance_period_does_not_exceed_one_month
  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_under_25_and_lives_with_one_or_both_parents
  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_to_be_released_from_prison
  entity: Person
  dtype: Boolean
  period: Day
- name: person_has_requested_advance_decision
  entity: Person
  dtype: Boolean
  period: Day
- name: days_before_release_when_advance_decision_is_made
  entity: Person
  dtype: Integer
  period: Day
- name: advance_assessment_finds_person_expected_to_meet_one_time_assistance_conditions
  entity: Person
  dtype: Boolean
  period: Day
- name: day_is_persons_release_day
  entity: Person
  dtype: Boolean
  period: Day
- name: advance_one_time_assistance_was_paid
  entity: Person
  dtype: Boolean
  period: Day
- name: actual_one_time_assistance_conditions_are_not_met_on_release_day
  entity: Person
  dtype: Boolean
  period: Day
