- name: public_benefit_arrears_amount_disregarded
  kind: derived
  entity: Payment
  dtype: Money
  unit: DKK
  period: Month
  source: Aktivloven § 33, stk. 1, nr. 8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-33
          excerpt: Det beløb, der ses bort fra, udgør differencen mellem den ydelse,
            der er udbetalt for perioden, og den retmæssige ydelse for perioden.
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-33
          excerpt: Der ses bort fra efterbetalingen i 2 år efter udbetalingstidspunktet.
  versions:
  - effective_from: '2025-06-30'
    formula: "if payment_is_public_benefit_arrears_after_decision_or_judgment\n  and\
      \ arrears_payment_is_within_two_years_after_payment:\n  max(0, rightful_benefit_for_arrears_period\
      \ - benefit_paid_for_arrears_period)\nelse: 0"
- name: payment_value_disregarded_from_assistance_deduction
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: Aktivloven § 33, stk. 1, nr. 1-11, og stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-33
          excerpt: 'Der foretages ikke fradrag i hjælpen for:'
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-33
          excerpt: i indkomstårene 2025 og 2026
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-33
          excerpt: Hvis sygehusopholdet har varet i mere end 3 måneder, kan der dog
            foretages fradrag
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-33
          excerpt: trækkes ikke fra i hjælpen.
  versions:
  - effective_from: '2025-06-30'
    formula: "payment_is_invalidity_pension_or_allowance\nor payment_is_employment_or_integration_act_compensation\n\
      or payment_is_election_official_remuneration\nor payment_is_tax_exempt_scholarship_or_social_fund_payment\n\
      or payment_is_child_income_or_income_relating_to_child\nor (\n  payment_is_value_of_hospital_food_or_similar\n\
      \  and (\n    not hospital_stay_exceeds_three_months\n    or not municipality_deducts_savings_from_long_hospital_stay\n\
      \  )\n)\nor payment_is_transport_compensation_for_documented_necessary_work_transport\n\
      or (\n  payment_is_public_benefit_arrears_after_decision_or_judgment\n  and\
      \ arrears_payment_is_within_two_years_after_payment\n)\nor payment_is_culture_pass_value_in_temporary_income_year_window\n\
      or payment_is_rental_income_from_at_most_one_lodger_in_recipient_home\nor payment_is_work_injury_education_compensation_paid_to_applicant_spouse\n\
      or payment_is_compensation_for_loss_of_earning_capacity_or_non_economic_damage"
