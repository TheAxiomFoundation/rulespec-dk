format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-33
    source_sha256: c1998411e6db70e3e6d25b840de4542b41160da562e026907c782f7aad6d8989
  summary: Der foretages ikke fradrag i hjælpen for de opregnede ydelser og indtægter,
    herunder efterbetaling af offentlige ydelser i 2 år. Ved sygehusophold over 3
    måneder kan kommunen dog fradrage en besparelse. Erstatninger for tab af erhvervsevne,
    varigt mén og ikke-økonomisk skade trækkes heller ikke fra.
