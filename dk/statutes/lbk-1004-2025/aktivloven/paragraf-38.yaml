format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-38
    source_sha256: 02faf5caa6e97ed0a002b191d9529658683d6c589368578e12db74c2075579e3
  summary: '"Hvis en person, der ansøger om eller modtager hjælp, har undladt at tilmelde
    sig som jobsøgende i jobcenteret, jf. § 8 a, stk. 1 eller 2, eller har undladt
    at registrere cv-oplysninger på Jobnet, jf. § 13 a, stk. 2, foretager kommunen
    fradrag i hjælpen ... medmindre den manglende tilmelding og registrering af cv-oplysninger
    ikke skyldes personens forhold."'
inputs:
- name: person_applies_for_or_receives_assistance
  entity: Person
