format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-6
    source_sha256: d828032b25371f97648a2217866f06196f301f239abf983a4b222633ab549f42
  summary: '§ 6, stk. 1: "Udbetaling Danmark kan bestemme, at en dansk statsborger,
    som har opholdt sig mange år i udlandet, kan få hjælp til forsørgelse, når hjemrejse
    derved kan undgås og andre forhold taler herfor." Det er betingelse, at hverken
    ansøgeren eller ægtefællen har indtægter eller formue, der kan dække det nødvendige
    behov.

    Stk. 2: Hjælpen fastsættes på grundlag af indstilling fra udenrigstjenesten med
    udgangspunkt i ansøgerens udgifter og levevilkårene i landet og kan ikke overstige
    folkepensionens grundbeløb med fradrag for eventuelle indtægter.'
