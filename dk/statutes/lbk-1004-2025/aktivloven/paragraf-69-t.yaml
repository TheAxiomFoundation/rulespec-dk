  period: Week
- name: employee_begins_job_clarification_programme
  entity: Employer
  dtype: Boolean
  period: Week
- name: wages_paid_during_sick_absence
  entity: Employer
  dtype: Money
  unit: DKK
  period: Week
- name: hourly_refusion_amount_based_on_resource_programme_benefit
  entity: Employer
  dtype: Money
  unit: DKK
  period: Week
- name: hours_for_which_employer_pays_wages
  entity: Employer
  dtype: Decimal
  period: Week
- name: employee_receives_wages_from_multiple_employers
  entity: Employer
  dtype: Boolean
  period: Week
- name: total_refusion_under_subsections_1_to_2
  entity: Employer
  dtype: Money
  unit: DKK
  period: Week
- name: total_hours_in_all_employment_relationships
  entity: Employer
  dtype: Decimal
  period: Week
- name: employer_entitlement_under_sickness_benefit_act
  entity: Employer
  dtype: Money
  unit: DKK
  period: Week
