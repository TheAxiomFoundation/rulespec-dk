- name: child_contribution_supplement
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Month
  source: Aktivloven § 71, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: En person under 25 år, som har en dokumenteret bidragspligt over
            for et barn, og som modtager revalideringsydelse efter satserne i stk.
            2, nr. 4 eller 5, får et månedligt tillæg, der svarer til det fastsatte
            bidrag, dog højst normalbidraget.
  versions:
  - effective_from: '2025-06-30'
    formula: "if has_documented_child_contribution_obligation\nand (ordinary_monthly_revalidation_rate\
      \ == under25_not_living_with_parents_rate\nor ordinary_monthly_revalidation_rate\
      \ == under25_living_with_parents_rate):\n  min(fixed_monthly_child_contribution,\
      \ normal_child_contribution)\nelse: 0"
