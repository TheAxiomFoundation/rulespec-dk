format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
    source_sha256: 893462cebbe3ec05e8d2a3e9d7668b302490c6a7f3d9c0f6af0ae61557827983
  summary: § 71 fastsætter månedlige revalideringsydelser efter alder, forsørgelse,
    bopæl, graviditet og dokumenteret psykisk lidelse; et bidragstillæg med loft;
    en højere sats ved tidligere gennemsnitsindtægt; kontanthjælp som erstatningsydelse;
    og bevarelse af forsørgelsesgrundlaget under forrevalidering.
