            psykisk lidelse, der er diagnosticeret som skizofreni, skizotypisk sindslidelse,
            vedvarende psykotisk tilstand, korterevarende psykotisk tilstand, skizoaffektiv
            lidelse, uspecificeret ikke organisk betinget psykose eller emotionelt
            ustabil personlighedsstruktur af borderlinetype, og har forsørgelsespligt
            over for ikke hjemmeboende børn, og 8) 12.326 kr.
  versions:
