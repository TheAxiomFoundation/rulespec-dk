    formula: '12'
- name: income_lookback_calendar_months
  kind: parameter
  dtype: Integer
  source: Aktivloven § 71, stk. 4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: de 6 kalendermåneder
  versions:
  - effective_from: '2025-06-30'
    formula: '6'
- name: average_prior_income
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Month
  source: Aktivloven § 71, stk. 4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: Stk. 4. Har personer omfattet af stk. 2, nr. 2-8, i de 6 kalendermåneder,
            der ligger forud for den måned, hvori beslutningen om revalidering er
            truffet, haft indtægter, jf. §§ 72 og 73, der gennemsnitligt overstiger
            20.373 kr. (2024-niveau) pr. måned, udgør revalideringsydelsen 20.373
            kr. (2024-niveau).
  versions:
  - effective_from: '2025-06-30'
    formula: relevant_income_in_prior_six_calendar_months / income_lookback_calendar_months
- name: ordinary_monthly_revalidation_rate
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Month
  source: Aktivloven § 71, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: For personer under 30 år udgør revalideringsydelsen et månedligt
            beløb
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: når personen forsørger eget barn i hjemmet
  versions:
  - effective_from: '2025-06-30'
    formula: 'if age_years >= adult_age_threshold: adult_monthly_revalidation_rate
      else: if supports_own_child_in_home: under30_supporting_own_child_rate else:
      if age_years >= age_25_threshold and has_support_obligation_for_nonresident_children:
      age_25_nonresident_children_rate else: if age_years >= age_25_threshold and
      not has_support_obligation_for_children: age_25_no_child_support_rate else:
      if is_pregnant_and_has_passed_twelfth_week: under25_pregnancy_rate else: if
      has_documented_listed_mental_disorder and has_support_obligation_for_nonresident_children:
      under25_documented_disorder_nonresident_children_rate else: if has_documented_listed_mental_disorder
      and not lives_with_one_or_both_parents: under25_documented_disorder_not_living_with_parents_rate
      else: if not lives_with_one_or_both_parents: under25_not_living_with_parents_rate
      else: under25_living_with_parents_rate'
- name: higher_income_rate_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Aktivloven § 71, stk. 4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: personer omfattet af stk. 2, nr. 2-8
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: gennemsnitligt overstiger 20.373 kr.
  versions:
  - effective_from: '2025-06-30'
    formula: 'age_years < adult_age_threshold

      and not supports_own_child_in_home

      and average_prior_income > adult_monthly_revalidation_rate'
- name: contribution_supplement_applied_to_debt
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Month
  source: Aktivloven § 71, stk. 3, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: Er bidraget forskudsvis udlagt på tidspunktet for udbetaling af
            hjælp, benyttes tillægget til afdrag på bidragsgælden.
  versions:
  - effective_from: '2025-06-30'
    formula: 'if contribution_has_been_advanced: child_contribution_supplement else:
      0'
- name: monthly_revalidation_benefit
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Month
  source: Aktivloven § 71, stk. 3-5
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: erstatter denne ydelse revalideringsydelsen
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: Revalideringsydelsen inklusive tillæg kan pr. måned højst udgøre
            16.382 kr.
  versions:
  - effective_from: '2025-06-30'
    formula: 'if receives_cash_assistance_under_section_16_subsection_2: cash_assistance_with_sections_17_and_18_supplements
      else: if higher_income_rate_applies: adult_monthly_revalidation_rate else: min(ordinary_monthly_revalidation_rate
      + child_contribution_supplement, revalidation_benefit_including_supplement_cap)'
