    formula: '12326'
- name: adult_age_threshold
  kind: parameter
  dtype: Decimal
  source: Aktivloven § 71, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: fyldt 30 år
  versions:
  - effective_from: '2025-06-30'
    formula: '30'
