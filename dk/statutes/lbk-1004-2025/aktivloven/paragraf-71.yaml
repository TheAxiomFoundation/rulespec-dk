      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-71
          excerpt: fyldt 25 år
  versions:
  - effective_from: '2025-06-30'
    formula: '25'
- name: pregnancy_week_threshold
  kind: parameter
  dtype: Integer
  source: Aktivloven § 71, stk. 2, nr. 6
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
