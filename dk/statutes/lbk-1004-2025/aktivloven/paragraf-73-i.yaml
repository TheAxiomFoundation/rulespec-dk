format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
    source_sha256: 5b3d6475474180946d0c7b95e5e18c3d9551040c321f9b5c2167a1f4faba8d97
  summary: Kommunen giver støtte til nødvendige merudgifter til bolig til personer
    under 25 år med nedsat funktionsevne, der opfylder betingelserne i stk. 1. Støtte
    ydes, når boligudgiften efter boligsikring overstiger 1.000 kr. pr. måned, højst
    med 2.000 kr. pr. måned og i højst 12 sammenhængende måneder; støtten bortfalder,
    hvis forrevalideringen ophører.
rules:
- name: age_limit_for_housing_support
  kind: parameter
  dtype: Count
  period: Month
  source: § 73 i, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: personer under 25 år
  versions:
  - effective_from: '2025-06-30'
    formula: '25'
- name: pre_rehabilitation_chapter_reference
  kind: parameter
  dtype: Integer
  period: Month
  source: § 73 i, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: forrevalidering efter kapitel 21
  versions:
  - effective_from: '2025-06-30'
    formula: '21'
- name: cash_assistance_first_subsection_reference
  kind: parameter
  dtype: Integer
  period: Month
  source: § 73 i, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: kontanthjælp efter § 16, stk. 1 eller 3
  versions:
  - effective_from: '2025-06-30'
    formula: '1'
- name: cash_assistance_third_subsection_reference
  kind: parameter
  dtype: Integer
  period: Month
  source: § 73 i, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: kontanthjælp efter § 16, stk. 1 eller 3
  versions:
  - effective_from: '2025-06-30'
    formula: '3'
- name: housing_support_second_subsection_reference
  kind: parameter
  dtype: Integer
  period: Month
  source: § 73 i, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: støtte til nødvendige merudgifter til bolig efter stk. 2
  versions:
  - effective_from: '2025-06-30'
    formula: '2'
- name: housing_support_payment_administration_conditions
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 73 i, stk. 2, 2.-4. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: Støtten udbetales i forbindelse med udbetaling af kontanthjælp
            efter § 16, stk.
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: første hele kalendermåned, efter at personen er blevet berettiget
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: højst udbetales i 12 sammenhængende måneder
  versions:
  - effective_from: '2025-06-30'
    formula: 'cash_assistance_is_paid_for_current_month

      and special_youth_supplement_is_paid_for_current_month

      and current_month_is_on_or_after_first_full_calendar_month_after_eligibility

      and preceding_consecutive_housing_support_payment_months < maximum_consecutive_housing_support_payment_months'
- name: monthly_housing_support
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Month
  source: § 73 i, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: Kommunen giver støtte til nødvendige merudgifter til bolig efter
            stk. 2
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: Støtten kan ikke overstige 2.000 kr. pr. måned
  versions:
  - effective_from: '2025-06-30'
    formula: "if housing_support_eligibility and housing_support_payment_conditions:\n\
      \  min(necessary_housing_extra_expenses_after_housing_security_including_electricity_and_heating,\
      \ maximum_monthly_housing_support)\nelse: 0"
- name: required_cash_assistance_and_special_youth_supplement_months
  kind: parameter
  dtype: Count
  period: Month
  source: § 73 i, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: i sammenlagt 6 måneder
  versions:
  - effective_from: '2025-06-30'
    formula: '6'
- name: housing_expense_threshold_after_housing_security
  kind: parameter
  dtype: Money
  unit: DKK
  period: Month
  source: § 73 i, stk. 2, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: overstiger 1.000 kr. pr. måned inklusive el og varme
  versions:
  - effective_from: '2025-06-30'
    formula: '1000'
- name: maximum_monthly_housing_support
  kind: parameter
  dtype: Money
  unit: DKK
  period: Month
  source: § 73 i, stk. 2, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: Støtten kan ikke overstige 2.000 kr. pr. måned
  versions:
  - effective_from: '2025-06-30'
    formula: '2000'
- name: maximum_consecutive_housing_support_payment_months
  kind: parameter
  dtype: Count
  period: Month
  source: § 73 i, stk. 2, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: kan højst udbetales i 12 sammenhængende måneder
  versions:
  - effective_from: '2025-06-30'
    formula: '12'
- name: housing_support_eligibility
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 73 i, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: personer under 25 år med nedsat fysisk eller psykisk funktionsevne
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: der ikke har en erhvervskompetencegivende uddannelse
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: deltager i forrevalidering efter kapitel 21
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: 1 eller 3, og særligt ungetillæg efter § 19, i sammenlagt 6 måneder.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: ikke være i stand til at gennemføre en SU-berettigende uddannelse
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: revalidering ikke antages at kunne bringe personen i arbejde inden
            for en rimelig periode
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: personen ikke være i stand til at påtage sig et arbejde
  versions:
  - effective_from: '2025-06-30'
    formula: 'person_is_under_25_years

      and person_has_reduced_physical_or_mental_functional_capacity

      and person_has_no_vocationally_qualifying_education

      and person_participates_in_pre_rehabilitation_under_chapter_21

      and months_receiving_cash_assistance_and_special_youth_supplement >= required_cash_assistance_and_special_youth_supplement_months

      and person_cannot_complete_su_qualifying_education

      and rehabilitation_is_not_expected_to_bring_person_into_work_within_reasonable_period

      and person_cannot_take_up_work'
- name: housing_support_payment_conditions
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 73 i, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: boligudgiften efter fradrag af boligsikring overstiger 1.000 kr.
            pr. måned
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-73-i
          excerpt: Støtten bortfalder, hvis forrevalideringen ophører
  versions:
  - effective_from: '2025-06-30'
    formula: 'necessary_housing_extra_expenses_after_housing_security_including_electricity_and_heating
      > housing_expense_threshold_after_housing_security

      and pre_rehabilitation_is_ongoing

      and housing_support_payment_administration_conditions'
