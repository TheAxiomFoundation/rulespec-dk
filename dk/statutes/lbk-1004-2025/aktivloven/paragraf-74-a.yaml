format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-74-a
    source_sha256: 7f4b3bcab3a91345bb522d2569cafe0a4bb95bd18d2cbea8d043f8e95c1e614b
  summary: § 74 a. Ledighedsydelsen udgør 89 pct. af arbejdsløshedsdagpengenes højeste
    beløb i stk. 2's fire tilfælde. Stk. 3 fastsætter 16.382 kr. og 12.326 kr. i 2024-niveau.
    Stk. 4 giver ret efter stk. 2 efter 9 måneders fleksjob inden for de seneste 18
    måneder.
rules:
- name: flexjob_visitation_chapter_number
  kind: parameter
  dtype: Integer
  period: Month
  source: Aktivloven § 74 a, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-74-a
          excerpt: efter kapitel 20 i lov om en aktiv beskæftigelsesindsats
  versions:
  - effective_from: '2025-06-30'
    formula: '20'
- name: higher_rate_first_condition_number
  kind: parameter
  dtype: Integer
  period: Month
  source: Aktivloven § 74 a, stk. 2, nr. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
