- name: higher_rate_fourth_condition_number
  kind: parameter
  dtype: Integer
  period: Month
  source: Aktivloven § 74 a, stk. 2, nr. 4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
