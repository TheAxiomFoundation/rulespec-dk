- name: payment_conditions_first_referenced_section_number
  kind: parameter
  dtype: Integer
  period: Month
  source: Aktivloven § 74 a, stk. 9
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-74-a
