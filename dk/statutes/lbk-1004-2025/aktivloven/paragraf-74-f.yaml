format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-74-f
    source_sha256: 34d64dc81110b2932c4d70e84d121b9037aa38f4f7db4c4333f8681d55f91176
  summary: Personer omfattet af § 74, stk. 2, har ret til ledighedsydelse ved ledighed
    inden for 78 uger efter ustøttet beskæftigelse, når de forinden var visiteret
    til fleksjob. Barsels- og sorgorlov medregnes ikke. Efter 9 måneders ustøttet
    beskæftigelse inden for 18 måneder efter fleksjobs ophør kan ledighedsydelse modtages
    efter § 74 a, stk. 2. Retten omfatter midlertidige ikke-selvforskyldte afbrydelser,
    bevares ved sygdom, barsel, sorgorlov og flytning og kan opstå ved flytterelateret
    opsigelse, hvis § 74 g er opfyldt.
rules:
