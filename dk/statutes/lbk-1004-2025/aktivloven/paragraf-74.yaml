format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-74
    source_sha256: c84f032e72968013339373ca831114e58bc98b861ed44c02d885590fef2f2497
  summary: '"Ledighedsydelse udbetales af kommunen til personer, der er berettiget
    til fleksjob"

    in the five listed circumstances in stk. 1. Persons formerly entitled to

    ledighedsydelse or employed in fleksjob who transition to unsupported employment

    may receive it in the four listed circumstances in stk. 2.'
