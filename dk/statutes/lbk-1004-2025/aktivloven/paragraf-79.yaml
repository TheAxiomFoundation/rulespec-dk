format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-79
    source_sha256: 6283d71504b3d0e69cde92a399eab813514b190a8ef483173327e099db8f2731
  summary: Kommunen indbetaler ATP-bidrag for personer, der er fyldt 16 år, og som
    modtager hjælp efter de nævnte bestemmelser. For § 16, stk. 1, nr. 2 kræves 12
    sammenhængende måneder samt ingen angivne nedsættelser eller fradrag. For øvrige
    nævnte ydelser gælder beregnede månedlige minimumsydelser på 16.382 kr. eller
    12.326 kr. i 2024-niveau. ATP-bidrag indbetales ikke ved tilbagebetalingspligt
    efter § 93.
