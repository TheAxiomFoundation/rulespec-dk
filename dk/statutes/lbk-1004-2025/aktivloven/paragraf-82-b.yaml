- name: child_age_limit_years
  kind: parameter
  dtype: Integer
  period: Month
  source: § 82 b, stk. 3, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: børn under 18 år
