format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
    source_sha256: 4ab1b767df7b55880248efac2e2ef99be1d65ed85453428528df4ecee7e8eff1
  summary: '§ 82 b, stk. 1-3: Kommunen yder hjælp til tilskudsberettiget medicin til
    kontanthjælpsmodtagere efter § 16 efter 12 måneder ud af de seneste 18 måneder.
    Hjælpen udgør 100 pct. af egenbetalingen efter tilskud efter kapitel 42 i sundhedsloven,
    men højst udgiften til billigste præparat. Reglerne gælder tilsvarende for egne
    børn under 18 år med samme CPR-adresse; barnet har ret fra tidspunktet, hvor forælderen
    har ret til kontanthjælp.'
rules:
- name: medicine_subsidy_law_chapter
  kind: parameter
  dtype: Integer
  period: Month
  source: § 82 b, stk. 2, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: efter tilskud efter kapitel 42 i sundhedsloven
  versions:
  - effective_from: '2025-06-30'
    formula: '42'
- name: medicine_payment_assistance_amount
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  source: § 82 b, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: udgør 100 pct. af kontanthjælpsmodtagerens egenbetaling
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: kan ikke overstige personens udgift til det billigste præparat
  versions:
  - effective_from: '2025-06-30'
    formula: 'if person_has_right_to_medicine_payment_assistance: max(0, min(medicine_payment_reimbursement_rate
      * medicine_out_of_pocket_payment_after_subsidy, cost_of_cheapest_medicine_preparation))
      else: 0'
- name: child_medicine_payment_assistance_amount
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  source: § 82 b, stk. 2-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: Stk. 1 og 2 finder tilsvarende anvendelse for en kontanthjælpsmodtagers
            egne børn
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: kan ikke overstige personens udgift til det billigste præparat
  versions:
  - effective_from: '2025-06-30'
    formula: 'if child_has_right_to_medicine_payment_assistance: max(0, min(medicine_payment_reimbursement_rate
      * medicine_out_of_pocket_payment_after_subsidy, cost_of_cheapest_medicine_preparation))
      else: 0'
- name: required_cash_assistance_receipt_months
  kind: parameter
  dtype: Count
  period: Month
  source: § 82 b, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
