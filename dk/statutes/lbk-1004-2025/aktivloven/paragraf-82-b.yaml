- name: person_has_right_to_medicine_payment_assistance
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 82 b, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: personer, der modtager kontanthjælp efter § 16
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: har modtaget kontanthjælpen i 12 måneder ud af de seneste 18 måneder
  versions:
  - effective_from: '2025-06-30'
    formula: 'person_receives_cash_assistance_under_section_16

      and medicine_is_eligible_for_subsidy

      and months_of_cash_assistance_received_in_latest_assessment_window >= required_cash_assistance_receipt_months'
- name: child_has_right_to_medicine_payment_assistance
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 82 b, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: egne børn under 18 år
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: 1 og 2 finder tilsvarende anvendelse for en kontanthjælpsmodtagers
            egne børn under 18 år, hvor kontanthjælpsmodtageren og barnet er bopælsregistreret
            i Det Centrale Personregister (CPR) på samme adresse.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-82-b
          excerpt: fra det tidspunkt, hvor forælderen har ret til kontanthjælp
  versions:
  - effective_from: '2025-06-30'
    formula: 'medicine_is_eligible_for_subsidy

      and person_is_own_child_of_cash_assistance_recipient

      and child_age_in_years < child_age_limit_years

      and child_and_cash_assistance_recipient_are_cpr_registered_at_same_address

      and parent_has_right_to_cash_assistance_under_section_16'
