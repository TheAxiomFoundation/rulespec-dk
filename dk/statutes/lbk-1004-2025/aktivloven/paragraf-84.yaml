format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-84
    source_sha256: 2421604a4815735de664c0d2b6412b221a89012b06bbfbbbf7c28a0a5e76a820
  summary: Kommunen kan yde hjælp til udgifterne ved at forsørge et barn, når forældremyndigheden
    ved forældremyndighedsindehaverens død er tillagt en anden eller andre, der ikke
    har forsørgelsespligt over for barnet. Det er en betingelse, at barnets indtægter
    ikke er tilstrækkelige til at dække udgifterne ved at forsørge barnet.
