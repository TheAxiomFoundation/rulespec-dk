- name: person_satisfies_conditions_under_section_11_subsection_2
  entity: Person
  dtype: Boolean
  period: Month
- name: person_has_high_housing_costs
  entity: Person
  dtype: Boolean
  period: Month
- name: person_has_substantial_maintenance_burden
  entity: Person
  dtype: Boolean
  period: Month
