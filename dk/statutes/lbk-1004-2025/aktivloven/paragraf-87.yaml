format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-87
    source_sha256: 338ff6f633d84003ca13a226c860060f43722d4522c7f3ec7877002c5dcb6a95
  summary: '§ 87, stk. 1: Persons satisfying § 11, stk. 2, and having high housing

    costs or a substantial maintenance burden may receive special support,

    separately or with assistance under chapters 6 a-7. Stk. 2 requires an

    investigation before grant and a concrete vacant reasonable cheaper dwelling

    that the person can occupy before support may be reduced or cease. Stk. 3

    preserves special support at the amount payable without a sanction-related

    reduction. Stk. 4 authorizes rules on calculation, limitation, and income

    deductions.'
