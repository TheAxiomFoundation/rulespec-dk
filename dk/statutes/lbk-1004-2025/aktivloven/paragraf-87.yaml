  period: Month
- name: reasonable_cheaper_dwelling_investigated_before_grant
  entity: Person
  dtype: Boolean
  period: Month
- name: municipality_has_found_concrete_vacant_reasonable_cheaper_dwelling
  entity: Person
  dtype: Boolean
  period: Month
- name: person_can_move_into_found_cheaper_dwelling
  entity: Person
  dtype: Boolean
  period: Month
