- name: one_time_assistance_may_be_paid_for_shorter_period
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: Aktivloven § 89, stk. 2.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-89
          excerpt: Kommunen kan udbetale engangshjælpen for kortere perioder, hvis
            der er begrundet tvivl om, at modtageren vil opfylde betingelserne for
            hjælp i hele den periode, som engangshjælpen er beregnet til at dække.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1004-2025/aktivloven/paragraf-89
          excerpt: hvis der er begrundet tvivl om, at modtageren vil opfylde betingelserne
            for hjælp i hele den periode
  versions:
  - effective_from: '2025-06-30'
    formula: 'payment_is_one_time_assistance

      and municipality_has_reasoned_doubt_recipient_will_fulfill_assistance_conditions_for_entire_covered_period'
