  period: Month
- name: child_support_is_due_in_assistance_payment_month
  entity: Payment
  dtype: Boolean
  period: Month
- name: municipality_notified_of_enforcement_request_for_rent_arrears
  entity: Payment
  dtype: Boolean
  period: Month
- name: enforcement_case_concluded_without_eviction
  entity: Payment
  dtype: Boolean
  period: Month
- name: assistance_payment_month_is_on_or_after_month_following_case_closure
  entity: Payment
  dtype: Boolean
  period: Month
- name: enforcement_case_concluded_with_eviction
  entity: Payment
  dtype: Boolean
  period: Month
- name: assistance_payment_month_is_on_or_after_third_month_following_eviction
  entity: Payment
  dtype: Boolean
  period: Month
- name: child_support_advanced_amount
  entity: Payment
  dtype: Money
  period: Month
- name: advance_payment_month_count
  entity: Payment
  dtype: Integer
  period: Month
- name: child_supplement_amount_under_section_17
  entity: Payment
  dtype: Money
  period: Month
