format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-100-e
    source_sha256: ab62f4b1d730afa687fbab1b31e5ce85e421a3dfe99d4ab8c5d43001b1d4f9a4
  summary: § 100 e. Personer under 18 år må ikke anvendes som tolke ved mundtlig kommunikation,
    jf. dog stk. 2. Stk. 2. Personer under 18 år må anvendes som tolke uanset stk.
    1, når kommunikationen vedrører et uproblematisk forhold.
inputs:
- name: person_age
  entity: Person
  dtype: Integer
  period: Day
- name: oral_communication_concerns_unproblematic_matter
  entity: Person
  dtype: Boolean
  period: Day
- name: person_is_under_18
  entity: Person
  dtype: Boolean
  period: Day
rules:
- name: interpreter_minimum_age
  kind: parameter
  dtype: Integer
  source: § 100 e, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-100-e
          excerpt: Personer under 18 år må ikke anvendes som tolke
  versions:
  - effective_from: '2025-08-28'
    formula: '18'
- name: person_may_be_used_as_interpreter_in_oral_communication
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 100 e, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-100-e
          excerpt: Personer under 18 år må ikke anvendes som tolke ved mundtlig kommunikation
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-100-e
          excerpt: Personer under 18 år må anvendes som tolke uanset stk. 1, når kommunikationen
            vedrører et uproblematisk forhold.
  versions:
  - effective_from: '2025-08-28'
    formula: '(person_age >= interpreter_minimum_age)

      or oral_communication_concerns_unproblematic_matter'
