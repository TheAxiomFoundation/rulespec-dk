    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-100
    source_sha256: 49348fcfb24e96347b181a7d3b2d6d2af91e86f5892bf2c56706cd3f58af9542
  summary: Afgørelser truffet af Udbetaling Danmark, jf. kapitel 11 c, kan af den,
    som afgørelsen vedrører, indbringes for Ankestyrelsens Beskæftigelsesudvalg. Klagen
    skal indbringes, inden 4 uger efter at klageren har fået meddelelse om afgørelsen.
