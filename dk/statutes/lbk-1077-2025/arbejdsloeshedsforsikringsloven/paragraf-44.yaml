  source_verification:
    corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-44
    source_sha256: 6fa07c1406cbac9b540271812b66cfe35c6ff3a9103e0f6bce8af26ea0399b73
  summary: § 44. Et medlem, som har nået folkepensionsalderen, kan overgå til et seniormedlemskab
    ved udgangen af den måned, hvor medlemmet har nået folkepensionsalderen. En person,
    som ikke er medlem af en arbejdsløshedskasse, og som har nået folkepensionsalderen,
    kan optages som seniormedlem. Et seniormedlem har ikke ret til dagpenge eller
    andre ydelser efter denne lov, men har ret til hjælp til jobsøgning og skal kun
    betale administrationsbidrag.
