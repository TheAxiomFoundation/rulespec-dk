format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
    source_sha256: e7a9addb411ed925969e354739437ec70c7431b4604a1e6d73f43507aea48617
  summary: 'Stk. 1: "80 pct. af højeste dagpenge ... dog højst et beløb svarende til
    medlemmets hidtidige dagpengesats."

    Stk. 2: vocational-education offers begun from 1 January through 31 December 2020
    pay the previous rate where listed under § 33 a, stk. 5.

    Stk. 3: vocational education begun under § 97 a pays 110 pct. of the previous
    rate, capped at 110 pct. of the highest benefit.'
rules:
- name: temporary_window_last_day_of_december
  kind: parameter
  dtype: Integer
  source: § 48 a, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: til og med den 31. december 2020
  versions:
  - effective_from: '2020-01-01'
    formula: '31'
- name: highest_unemployment_benefit_reference_section
  kind: parameter
  dtype: Integer
  source: § 48 a, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: jf. §§ 47 og 70
  versions:
  - effective_from: '2020-01-01'
    formula: '70'
- name: education_offer_standard_rate
  kind: parameter
  dtype: Rate
  source: § 48 a, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: 80 pct. af højeste dagpenge
  versions:
  - effective_from: '2020-01-01'
    formula: '0.80'
- name: vocational_education_enhanced_rate
  kind: parameter
  dtype: Rate
  source: § 48 a, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: 110 pct. af medlemmets hidtidige dagpengesats
  versions:
  - effective_from: '2020-01-01'
    formula: '1.10'
- name: unemployment_benefit_for_education_offer
  kind: derived
  entity: Person
  dtype: Money
  period: Day
  unit: DKK
  source: § 48 a, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: deltager i tilbud om en uddannelse efter § 96
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: jf. dog stk. 2
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: fra den 1. januar 2020 til og med den 31. december 2020
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: hvis uddannelsen fremgår af en liste udarbejdet efter § 33 a, stk.
            5
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-48-a
          excerpt: dog højst 110 pct. af dagpengenes højeste beløb
  versions:
  - effective_from: '2020-01-01'
    formula: "if education_commencement_is_in_temporary_effective_window and member_begins_vocational_education_offer_under_section_96\
      \ and vocational_education_is_on_section_33_a_subsection_5_list:\n  member_previous_unemployment_benefit_rate\n\
      else:\n  if member_participates_in_education_offer_under_section_96:\n    min(education_offer_standard_rate\
      \ * highest_unemployment_benefit_rate, member_previous_unemployment_benefit_rate)\n\
      \  else:\n    if member_begins_vocational_education_under_section_97_a:\n  \
      \    min(vocational_education_enhanced_rate * member_previous_unemployment_benefit_rate,\
      \ vocational_education_enhanced_rate * highest_unemployment_benefit_rate)\n\
      \    else:\n      0"
