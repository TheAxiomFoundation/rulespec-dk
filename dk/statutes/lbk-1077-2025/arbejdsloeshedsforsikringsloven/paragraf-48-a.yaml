- name: member_begins_vocational_education_under_section_97_a
  entity: Person
  dtype: Boolean
  period: Day
- name: member_previous_unemployment_benefit_rate
  entity: Person
  dtype: Money
  period: Day
  unit: DKK
- name: highest_unemployment_benefit_rate
  entity: Person
  dtype: Money
  period: Day
  unit: DKK
