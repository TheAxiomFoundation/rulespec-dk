  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-50
          excerpt: Foreligger der ikke et indtægtsgrundlag efter 1. pkt., udbetales
