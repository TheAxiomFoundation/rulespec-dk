format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1077-2025/arbejdsloeshedsforsikringsloven/paragraf-50
    source_sha256: 0e22d63c6d6f527e31a56bb0462ce4073111292169f088fe22751f2b88a23d0a
  summary: Uanset § 48, stk. 2, 1. pkt., kan indtægt i ikkemedlemsperioder indgå i
    indtægtsgrundlaget for medlemmer med ret til dagpenge under den midlertidige arbejdsfordelingsordning.
    Uden indtægtsgrundlag udgør dagpengene 71,5 pct. af højeste dagpenge, og satsen
    gælder i perioden under ordningen.
