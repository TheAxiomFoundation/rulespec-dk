format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/afsnit-1-kapitel-1-paragraf-7
    source_sha256: 744d5d05499851caba492a36189bfa78262d790044e6747c976e807c8d93773e
  summary: '"Ved beregning af en procentandel af fuld pension beregnes først en fuld
    pension ved anvendelse af reglerne i kapitel 2 a, 4, 4 a og 4 b. Det beregnede
    pensionsbeløb nedsættes ved at gange beløbet med den beregnede procent efter §
    5, stk. 3, og § 6, stk. 3. Tillæg efter §§ 14, 14 a og 14 e nedsættes dog ikke."'
