format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
    source_sha256: c403c19d25977e888c3257bbbc69d1bb280cb947aec03277a1729d9beba06770
  summary: § 15 c. Folkepension kan opsættes for i alt 120 måneder. Opsætning ophører
    efter anmodning fra den 1. i måneden efter anmodningen, uden anmodning efter 120
    måneder, og dagen efter dødsfald under opsætning.
inputs:
- name: total_deferred_pension_months
  entity: Person
  dtype: Integer
  period: Month
- name: request_to_end_pension_deferral_made
  entity: Person
  dtype: Boolean
  period: Day
- name: day_is_first_of_month_after_deferral_end_request
  entity: Person
  dtype: Boolean
  period: Day
- name: pension_deferral_is_active
  entity: Person
  dtype: Boolean
  period: Day
- name: person_died
  entity: Person
  dtype: Boolean
  period: Day
- name: day_is_day_after_death
  entity: Person
  dtype: Boolean
  period: Day
rules:
- name: maximum_pension_deferral_months
  kind: parameter
  dtype: Integer
  source: § 15 c, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: Folkepension kan opsættes for i alt 120 måneder.
  versions:
  - effective_from: '2024-10-01'
    formula: '120'
- name: first_day_of_month_after_request
  kind: parameter
  dtype: Integer
  source: § 15 c, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: med virkning fra den 1. i måneden efter anmodningen
  versions:
  - effective_from: '2024-10-01'
    formula: '1'
- name: pension_deferral_is_within_maximum_duration
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 15 c, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: Folkepension kan opsættes for i alt 120 måneder.
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: for i alt 120 måneder
  versions:
  - effective_from: '2024-10-01'
    formula: total_deferred_pension_months <= maximum_pension_deferral_months
- name: pension_deferral_ends_after_request
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 15 c, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: med virkning fra den 1. i måneden efter anmodningen
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: efter anmodning til Udbetaling Danmark
  versions:
  - effective_from: '2024-10-01'
    formula: 'request_to_end_pension_deferral_made

      and day_is_first_of_month_after_deferral_end_request'
- name: pension_deferral_ends_at_maximum_duration
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 15 c, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: Opsætning af pension ophører uden anmodning
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: når pensionen har været opsat i 120 måneder
  versions:
  - effective_from: '2024-10-01'
    formula: total_deferred_pension_months == maximum_pension_deferral_months
- name: pension_deferral_ends_day_after_death
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 15 c, stk. 4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: Dør en person, mens pensionen er opsat
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-c
          excerpt: ophører opsætningen fra dagen efter dødsfaldet
  versions:
  - effective_from: '2024-10-01'
    formula: 'pension_deferral_is_active

      and person_died

      and day_is_day_after_death'
