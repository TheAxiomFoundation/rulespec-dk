  entity: PensionDeferralPeriod
  dtype: Integer
  period: Month
- name: life_expectancy_in_whole_months_at_cessation
  entity: PensionDeferralPeriod
  dtype: Decimal
  period: Month
- name: life_expectancy_in_whole_months_over_ten_year_period_at_cessation
