format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
    source_sha256: f7d72e0b7ce420a45fa3dd414837e0860066ff1ebd18fe370f3b8782ee0bd064
  summary: Ved opsætningens ophør opgøres venteprocenten for opsætningsperioden. Ved
    livsvarigt tillæg er den forholdet mellem hele måneder med opsat pension og middellevetid
    i hele måneder; ved tillæg udbetalt over 120 måneder bruges middellevetiden over
    en 10-årig periode. Venteprocenten afrundes til to decimaler. Ved ophør ved død
    beregnes ingen venteprocent, og der udbetales ikke engangsbeløb efter § 15 d,
    stk. 4.
rules:
- name: payment_over_months
  kind: parameter
  dtype: Integer
  source: § 15 e, stk. 1, 3. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: tillæg udbetalt over 120 måneder
  versions:
  - effective_from: '2024-10-21'
    formula: '120'
- name: ten_year_period
  kind: parameter
  dtype: Integer
  source: § 15 e, stk. 1, 3. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: middellevetiden over en 10-årig periode
  versions:
  - effective_from: '2024-10-21'
    formula: '10'
- name: waiting_percentage_decimal_places
  kind: parameter
  dtype: Integer
  source: § 15 e, stk. 1, 4. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Venteprocenten afrundes til to decimaler.
  versions:
  - effective_from: '2024-10-21'
    formula: '2'
- name: waiting_percentage_rounding_scale
  kind: parameter
  dtype: Integer
  source: § 15 e, stk. 1, 4. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Venteprocenten afrundes til to decimaler.
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: middellevetiden over en 10-årig periode
  versions:
  - effective_from: '2024-10-21'
    formula: ten_year_period * ten_year_period
- name: waiting_percentage_is_calculated
  kind: derived
  entity: PensionDeferralPeriod
  dtype: Judgment
  period: Month
  source: § 15 e, stk. 1, 1. pkt., jf. stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Ved opsætningens ophør opgør Udbetaling Danmark venteprocenten
            for opsætningsperioden, jf. dog stk. 3.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Ved opsætningens ophør ved død, jf. § 15 c, stk. 4, beregnes der
            ikke venteprocent
  versions:
  - effective_from: '2024-10-21'
    formula: 'deferral_has_ceased

      and not cessation_is_due_to_death'
- name: waiting_percentage
  kind: derived
  entity: PensionDeferralPeriod
  dtype: Rate
  period: Month
  source: § 15 e, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Ved livsvarigt tillæg opgøres venteprocenten som forholdet mellem
            antallet af hele måneder, pensionen har været opsat, og middellevetiden
            i hele måneder
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Ved tillæg udbetalt over 120 måneder opgøres venteprocenten som
            forholdet mellem antallet af hele måneder, pensionen har været opsat,
            og middellevetiden over en 10-årig periode i hele måneder
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Venteprocenten afrundes til to decimaler.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Ved opsætningens ophør ved død, jf. § 15 c, stk. 4, beregnes der
            ikke venteprocent
  versions:
  - effective_from: '2024-10-21'
    formula: "if waiting_percentage_is_calculated:\n  floor(\n    (\n      if supplement_payment_months\
      \ == payment_over_months:\n        whole_months_pension_deferred / life_expectancy_in_whole_months_over_ten_year_period_at_cessation\n\
      \      else:\n        whole_months_pension_deferred / life_expectancy_in_whole_months_at_cessation\n\
      \    ) * waiting_percentage_rounding_scale + (1 / waiting_percentage_decimal_places)\n\
      \  ) / waiting_percentage_rounding_scale\nelse:\n  0"
- name: waiting_percentage_is_assessed_for_each_deferral_period
  kind: derived
  entity: PensionDeferralPeriod
  dtype: Judgment
  period: Month
  source: § 15 e, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Har folkepensionen været opsat to gange med mellemliggende pensionsudbetaling,
            jf. § 15 b, stk. 3, opgøres venteprocenten for hver periode for sig.
  versions:
  - effective_from: '2024-10-21'
    formula: folkepension_deferred_twice_with_intervening_pension_payment
- name: lump_sum_payment_after_death_cessation_is_prohibited
  kind: derived
  entity: PensionDeferralPeriod
  dtype: Judgment
  period: Month
  source: § 15 e, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-15-e
          excerpt: Ved opsætningens ophør ved død, jf. § 15 c, stk. 4, beregnes der
            ikke venteprocent, og der udbetales ikke engangsbeløb efter § 15 d, stk.
            4, efter ophøret.
  versions:
  - effective_from: '2024-10-21'
    formula: cessation_is_due_to_death
