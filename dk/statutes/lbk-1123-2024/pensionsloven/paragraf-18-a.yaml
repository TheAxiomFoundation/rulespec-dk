  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-18-a
    source_sha256: 81b45587745b48f07d00d06ee0dcd68aadfb6f5e5c6557433998abbfbf97bd6d
  summary: '"Afviser en person at modtage behandling foretaget af en læge i form af
    operation eller lægeordineret medicin eller lægebehandling af tilsvarende indgribende
    karakter, kan det ikke tillægges betydning ved vurderingen af personens ret til
    seniorpension eller førtidspension."'
