format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-26-v
    source_sha256: 74c2e00c99bcb4de785bd199fb0ac9ffc269e7eb9f1d0823839b62bf869a31fc
  summary: '§ 26 v, stk. 1-3: Tidlig pension kan ikke udbetales samtidig med anden
    offentlig forsørgelsesydelse, med undtagelse af sygedagpenge, barselsdagpenge,
    invaliditetsydelse og hjælp efter aktivlovens § 27 a. Udbetaling er også udelukket
    ved tilkendt førtidspension eller seniorpension samt ved nærmere angivne udenlandske
    pensioner, dog med EU-retlig undtagelse for udenlandsk pension svarende til folkepension.'
