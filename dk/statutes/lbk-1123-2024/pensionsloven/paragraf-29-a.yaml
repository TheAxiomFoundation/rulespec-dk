          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: dk:statutes/lbk-1123-2024/pensionsloven/paragraf-29-a#current_information_category_first_number
          output: current_information_category_first_number
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
