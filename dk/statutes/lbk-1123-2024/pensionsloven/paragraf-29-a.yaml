      - path: versions[0].formula
        kind: import
        import:
          target: dk:statutes/lbk-1123-2024/pensionsloven/paragraf-29-a#tax_report_category_first_number
          output: tax_report_category_first_number
          hash: sha256:local
      - path: versions[0].formula
        kind: import
        import:
          target: dk:statutes/lbk-1123-2024/pensionsloven/paragraf-29-a#tax_report_category_last_number
          output: tax_report_category_last_number
          hash: sha256:local
  versions:
  - effective_from: '2024-10-21'
    formula: 'application_for_health_supplement_has_been_made

      and wealth_category_under_section_14b_subsection_2 >= tax_report_category_first_number

      and wealth_category_under_section_14b_subsection_2 <= tax_report_category_last_number

      and not material_changes_affect_health_supplement_payment'
