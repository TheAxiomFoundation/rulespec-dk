  versions:
  - effective_from: '2024-10-21'
    formula: "application_for_health_supplement_has_been_made\nand (\n  (\n    wealth_category_under_section_14b_subsection_2\
      \ >= tax_report_category_first_number\n    and wealth_category_under_section_14b_subsection_2\
