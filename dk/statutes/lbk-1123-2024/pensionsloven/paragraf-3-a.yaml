format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-3-a
    source_sha256: 72e76e5a2bcbe379bd4c141de837e1c10ba88d564443bdf7eccd85b80693869b
  summary: '"Udlændinge omfattet af § 2, stk. 2, nr. 2" who take residence in their
    home country or former country of residence after award of folkepension retain
    the right to receive the pension base amount and specified supplements. Stk. 2
    gives a corresponding right to specified permit holders within § 2, stk. 2, nr.
    1; persons under nr. 3-5 and nr. 7 must return together with the family-connected
    person.'
