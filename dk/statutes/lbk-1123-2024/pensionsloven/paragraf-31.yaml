- name: basic_amount_and_pension_supplement_cap_applies
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: § 31, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-31
