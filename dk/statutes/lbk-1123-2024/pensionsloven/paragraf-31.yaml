    formula: 'pensioner_is_covered_by_section_46_d

      or pensioner_is_covered_by_section_46_f

      or pensioner_is_covered_by_section_46_g'
- name: basic_amount_and_pension_supplement_payable
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  source: § 31, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-31
          excerpt: Det beregnede grundbeløb og pensionstillæg kan højst udbetales
            med et beløb svarende til selvforsørgelses- og hjemrejseydelse eller overgangsydelse
  versions:
  - effective_from: '2024-10-21'
    formula: 'if basic_amount_and_pension_supplement_cap_applies: min( calculated_basic_amount
      + calculated_pension_supplement, corresponding_self_support_repatriation_or_transition_benefit_amount
      ) else: calculated_basic_amount + calculated_pension_supplement'
