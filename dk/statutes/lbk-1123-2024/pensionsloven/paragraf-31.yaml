- name: pension_supplement_reduction
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  source: § 31, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-31
          excerpt: Pensionstillæg nedsættes med en fast procent af indtægtsgrundlaget,
            jf. § 29.
      - path: versions[0].formula
        kind: parameter_table
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-31
          excerpt: Nedsættelsen sker med følgende procentsatser
  versions:
  - effective_from: '2024-10-21'
    formula: "income_basis_under_section_29 * (\n  if pensioner_is_single:\n    pension_supplement_reduction_rate_for_single_pensioner\n\
      \  else: if pensioner_spouse_or_cohabitant_has_no_social_pension_entitlement:\n\
      \    pension_supplement_reduction_rate_for_pensioner_with_nonentitled_spouse_or_cohabitant\n\
      \  else: if pensioner_spouse_or_cohabitant_also_has_social_pension_entitlement:\n\
      \    pension_supplement_reduction_rate_for_pensioner_with_entitled_spouse_or_cohabitant\n\
      \  else: if cohabiting_pensioner_is_treated_as_single_under_section_29_2:\n\
      \    pension_supplement_reduction_rate_for_cohabiting_pensioner_treated_as_single\n\
      \  else:\n    0\n)"
- name: personal_supplement_percentage
  kind: derived
  entity: Person
  dtype: Rate
  period: Year
  source: § 31, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-31
          excerpt: nedsættes med 1 pct. for hvert beløb, jf. § 49, stk. 5, hvormed
            indtægtsgrundlaget efter § 29, stk. 1-4, overstiger fradragsbeløbet efter
            § 49, stk. 1, nr. 6.
  versions:
  - effective_from: '2024-10-21'
    formula: "max(\n  0,\n  personal_supplement_percentage_default\n  - floor(\n \
      \   max(0, income_basis_under_section_29 - deduction_amount_under_section_49_1_6)\n\
      \    / income_increment_under_section_49_5\n  ) * personal_supplement_percentage_reduction_per_income_increment\n\
      )"
