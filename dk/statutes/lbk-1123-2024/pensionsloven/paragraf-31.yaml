  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-31
    source_sha256: 8a8b4c56a871a4b7242693309b1939fff7050a0fb97212a364608d5d48ddf452
  summary: '§ 31, stk. 1: "Pensionstillæg nedsættes med en fast procent af indtægtsgrundlaget"

    at 30,9 pct., 32,0 pct., 16,0 pct., or 32,0 pct. for the listed pensioner

    situations. Stk. 2: the personal supplement percentage starts at 100 and is

    reduced by 1 pct. for each § 49, stk. 5 amount by which income exceeds the

    § 49, stk. 1, nr. 6 deduction. Stk. 3 caps calculated basic amount and pension

    supplement for pensioners covered by §§ 46 d, 46 f, or 46 g.'
