    source_sha256: 24c87692a859d6365e71da3622d86b0212d14f28e1d72460f23f5701632e80f0
  summary: I førtidspension og seniorpension, som efterbetales for en periode forud
    for tilkendelsen, fratrækkes specificerede forsørgelsesydelser udbetalt for samme
    periode. For meget udbetalt pension og boligstøtte kan fratrækkes pensionen.
