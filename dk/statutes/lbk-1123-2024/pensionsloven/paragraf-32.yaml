  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-32
    source_sha256: 0d8bab10679cd197ea11f72097d2c4d688a78b779c832a76a2f3587173922f2c
  summary: '§ 32, stk. 1-3: Udbetaling Danmark kan fradrage for meget udbetalt pension
    og boligstøtte i pensionen, når den er ansvarlig for udbetalingen. Kommunalbestyrelsen
    kan fradrage for meget udbetalt pension, når kommunen er ansvarlig, og kan anmode
    Udbetaling Danmark om fradrag af tilbagebetalingskrav for personlige tillæg.'
