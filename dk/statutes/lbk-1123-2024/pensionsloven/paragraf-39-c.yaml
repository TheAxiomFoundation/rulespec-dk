          excerpt: Beløbet omregnes til et bruttobeløb ved at dividere med 0,6.
  versions:
  - effective_from: '2024-10-21'
    formula: fradragsberettiget_indbetalingsbeloeb / bruttobeloebsdivisor
- name: fradrag_sker_i_personlig_indkomst_ved_arbejde
  kind: derived
  entity: Person
