format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39-c
    source_sha256: 41b89326ea058a3554bf520dab2aa5f578596e01a1b5e477c96b33144677f32d
  summary: Ved opgørelsen af den personlige indkomst fradrages samlede indbetalinger
    til aldersforsikring, aldersopsparing og supplerende engangssum, højst pensionsopsparerens
    gældende grundbeløb. Beløbet omregnes til bruttobeløb ved division med 0,6, fradrages
    i indtægt ved personligt arbejde, fordeles ligeligt over kalenderåret, og § 39
    b, stk. 6, finder ikke anvendelse.
rules:
- name: bruttobeloebsdivisor
  kind: parameter
  dtype: Rate
  source: § 39 c, stk. 1, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39-c
          excerpt: Beløbet omregnes til et bruttobeløb ved at dividere med 0,6.
  versions:
  - effective_from: '2024-10-21'
    formula: '0.6'
- name: samlede_kvalificerende_indbetalinger
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Year
  source: § 39 c, stk. 1, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39-c
          excerpt: 2, fradrages et beløb svarende til størrelsen på de samlede indbetalinger
            til aldersforsikring efter pensionsbeskatningslovens § 10 A, aldersopsparing
            efter pensionsbeskatningslovens § 12 A og supplerende engangssum efter
            pensionsbeskatningslovens § 29 A som opgjort efter stk.
  versions:
  - effective_from: '2024-10-21'
    formula: 'aldersforsikring_indbetalinger

      + aldersopsparing_indbetalinger

      + supplerende_engangssum_indbetalinger'
- name: fradragsberettiget_indbetalingsbeloeb
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Year
  source: § 39 c, stk. 1, 1. pkt., og stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39-c
          excerpt: kan ikke overstige det grundbeløb, der efter pensionsbeskatningslovens
            § 16, stk. 1, gælder for pensionsopspareren.
  versions:
  - effective_from: '2024-10-21'
    formula: min(samlede_kvalificerende_indbetalinger, pensionsopsparerens_gaeldende_grundbeloeb)
