            efter §§ 29 og 32 a.
  versions:
  - effective_from: '2024-10-21'
    formula: 'day_is_january_1

      and income_basis_under_sections_29_and_32_a_is_available'
- name: recalculation_due_to_income_change
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 2, nr. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Pensionen i kalenderåret omregnes i løbet af året, hvis 1) det
            månedligt opgjorte indtægtsgrundlag afviger fra det hidtil anvendte indtægtsgrundlag
            og en beregning på grundlag af det opgjorte indtægtsgrundlag fører til
            en ændring af pensionens størrelse eller 2) der sker en ændring af de
            personlige forhold, som har betydning for beregningen af pensionen, eller
            3) pensionistens ægtefælle eller samlever dør og dødsfaldet har betydning
            for beregningen af pensionen.
  versions:
  - effective_from: '2024-10-21'
    formula: 'monthly_income_basis_differs_from_previously_used_basis

      and recalculation_using_monthly_income_basis_changes_pension_amount'
- name: recalculation_due_to_personal_change
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 2, nr. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: der sker en ændring af de personlige forhold, som har betydning
            for beregningen af pensionen
  versions:
  - effective_from: '2024-10-21'
    formula: personal_circumstances_have_changed_with_significance_for_pension_calculation
- name: recalculation_due_to_spouse_or_cohabitant_death
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 2, nr. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: pensionistens ægtefælle eller samlever dør og dødsfaldet har betydning
            for beregningen af pensionen
  versions:
  - effective_from: '2024-10-21'
    formula: 'spouse_or_cohabitant_has_died

      and spouse_or_cohabitant_death_has_significance_for_pension_calculation'
- name: pension_recalculation_required_during_calendar_year
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Pensionen i kalenderåret omregnes i løbet af året, hvis 1) det
            månedligt opgjorte indtægtsgrundlag afviger fra det hidtil anvendte indtægtsgrundlag
            og en beregning på grundlag af det opgjorte indtægtsgrundlag fører til
            en ændring af pensionens størrelse eller 2) der sker en ændring af de
            personlige forhold, som har betydning for beregningen af pensionen, eller
            3) pensionistens ægtefælle eller samlever dør og dødsfaldet har betydning
            for beregningen af pensionen.
  versions:
  - effective_from: '2024-10-21'
    formula: 'recalculation_due_to_income_change

      or recalculation_due_to_personal_change

      or recalculation_due_to_spouse_or_cohabitant_death'
- name: income_recalculation_effective_for_entire_assessment_period
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 3, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
