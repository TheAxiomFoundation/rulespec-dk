          excerpt: Omregning efter stk. 2, nr. 1, sker med virkning for hele opgørelsesperioden.
  versions:
  - effective_from: '2024-10-21'
    formula: 'recalculation_due_to_income_change

      and day_is_in_entire_income_recalculation_assessment_period'
