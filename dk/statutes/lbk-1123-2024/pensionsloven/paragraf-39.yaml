  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 3, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Helbredstillæg omregnes dog kun med virkning fra den 1. i førstkommende
            måned
  versions:
  - effective_from: '2024-10-21'
    formula: 'recalculation_due_to_income_change

      and day_is_first_of_next_month_when_pension_is_calculated_on_new_income_basis'
- name: personal_change_recalculation_effective_from_next_month
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Omregning efter stk. 2, nr. 2, sker med virkning fra den 1. i måneden
            efter de ændrede forhold
  versions:
  - effective_from: '2024-10-21'
    formula: 'recalculation_due_to_personal_change

      and day_is_first_of_month_after_changed_personal_circumstances

      and pensioner_knew_or_should_have_known_recalculation_was_required'
- name: death_recalculation_effective_day_after_death
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 5, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Omregning efter stk. 2, nr. 3, sker med virkning fra dagen efter
            pensionistens ægtefælles eller samlevers dødsfald.
  versions:
  - effective_from: '2024-10-21'
    formula: 'recalculation_due_to_spouse_or_cohabitant_death

      and day_is_day_after_spouse_or_cohabitant_death'
- name: survivor_pension_recalculation_effective_after_survivor_pension_ceases
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 5, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: For en efterlevende ægtefælle eller samlever, der modtager efterlevelsespension,
            omregnes pensionen med virkning fra dagen efter ophør af udbetaling af
            efterlevelsespension
  versions:
  - effective_from: '2024-10-21'
    formula: 'surviving_spouse_or_cohabitant_receives_survivor_pension

      and day_is_day_after_survivor_pension_payment_ceases'
- name: recalculated_income_assessment_period_runs_to_calendar_year_end
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: § 39, stk. 6
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Stk. 6. Ved omregning af pension efter stk. 2, nr. 2 og 3, ændres
            opgørelsesperioden for indtægtsgrundlaget til perioden fra det tidspunkt,
            som pensionen omregnes med virkning fra, til kalenderårets udgang.
  versions:
  - effective_from: '2024-10-21'
    formula: '(recalculation_due_to_personal_change

      or recalculation_due_to_spouse_or_cohabitant_death)

      and assessment_period_runs_from_recalculation_effective_date_to_calendar_year_end'
- name: supplementary_pension_benefit_must_be_repaid
  kind: derived
  entity: Person
  dtype: Judgment
  period: Year
  source: § 39, stk. 7
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Den supplerende pensionsydelse efterbetales, hvis Udbetaling Danmark
            inden 6 måneder efter udgangen af januar modtager nye oplysninger
  versions:
  - effective_from: '2024-10-21'
    formula: 'new_wealth_information_received_within_six_months_after_end_of_january

      and wealth_at_january_1_did_not_exceed_wealth_limit

      and other_conditions_for_supplementary_pension_benefit_are_met'
- name: minister_may_set_information_rules_for_pension_determination_and_recalculation
  kind: derived
  entity: Beskaeftigelsesminister
  dtype: Judgment
  period: Year
  source: § 39, stk. 8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
          excerpt: Beskæftigelsesministeren kan fastsætte regler, der sikrer, at Udbetaling
            Danmark og kommunalbestyrelsen modtager oplysninger
  versions:
  - effective_from: '2024-10-21'
    formula: 'true'
