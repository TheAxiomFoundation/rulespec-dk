format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-39
    source_sha256: 0333859bcfe9ab271c69aee6692a5108a39a972cc9d65ed318a3c8eaa54a4c92
  summary: § 39. Pensionen fastsættes hver 1. januar på grundlag af indtægten opgjort
    efter §§ 29 og 32 a. Stk. 2-6 fastsætter situationer, virkningstidspunkter og
    opgørelsesperioder for omregning. Stk. 7 fastsætter betingelser for efterbetaling
    af supplerende pensionsydelse.
rules:
