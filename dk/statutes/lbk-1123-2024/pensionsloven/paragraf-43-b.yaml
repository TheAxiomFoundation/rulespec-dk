  summary: Afviser en pensionist at modtage lægeforetaget operation, lægeordineret
    medicin eller lægebehandling af tilsvarende indgribende karakter, kan afslaget
    ikke tillægges betydning ved vurderingen af fortsat ret til førtidspension.
