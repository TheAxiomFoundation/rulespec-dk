  source_verification:
    corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-48-b
    source_sha256: 3cc5f5ca6ed3847390d9b280223905a7121d70975a43fdbed410a8a57cd1d688
  summary: I tidlig pension, som efterbetales for en periode, der ligger forud for
    tilkendelsen, fratrækkes de opregnede ydelser udbetalt for samme periode. Udbetaling
    Danmark kan fradrage for meget udbetalt pension og boligstøtte i udbetalingen
    af tidlig pension.
