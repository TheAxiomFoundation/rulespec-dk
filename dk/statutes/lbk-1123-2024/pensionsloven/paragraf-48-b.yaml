rules:
- name: mandatory_deductions_from_early_pension_afterpayment
  kind: derived
  entity: Payment
  dtype: Money
  period: Month
  source: § 48 b, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-48-b
          excerpt: fratrækkes sygedagpenge, arbejdsløshedsdagpenge, kontantydelse
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-48-b
          excerpt: efterbetales for en periode, der ligger forud for tilkendelsen
  versions:
  - effective_from: '2024-10-21'
    formula: "if early_pension_is_afterpaid_for_period_before_award:\n  sick_pay_paid_for_same_period\n\
      \  + unemployment_benefits_paid_for_same_period\n  + cash_benefit_paid_for_same_period\n\
      \  + self_support_and_repatriation_benefit_paid_for_same_period\n  + transition_benefit_paid_for_same_period\n\
      \  + unemployment_allowance_paid_for_same_period\n  + resource_course_benefit_paid_for_same_period\n\
      \  + education_assistance_paid_for_same_period\n  + cash_assistance_paid_for_same_period\n\
      else: 0"
- name: early_pension_afterpayment_after_mandatory_deductions
  kind: derived
  entity: Payment
  dtype: Money
  period: Month
  source: § 48 b, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-48-b
          excerpt: I tidlig pension, som efterbetales for en periode, der ligger forud
            for tilkendelsen, jf. § 33, stk. 3, fratrækkes sygedagpenge, arbejdsløshedsdagpenge,
            kontantydelse, selvforsørgelses- og hjemrejseydelse, overgangsydelse,
            ledighedsydelse, ressourceforløbsydelse, uddannelseshjælp og kontanthjælp,
            der er udbetalt for den samme periode.
      - path: versions[0].formula
