  summary: Pensionstillæg forhøjes hver 1. januar i perioden 2016-2023 med et kompensationstillæg,
    som svarer til den mindre samlede stigning af grundbeløbet og pensionstillægget
    som følge af fradraget af en procentsats efter § 49 a.
