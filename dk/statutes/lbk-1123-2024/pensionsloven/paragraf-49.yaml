- name: amount_rounded_to_nearest_multiple_of_twelve
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Year
  source: § 49, stk. 4, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1123-2024/pensionsloven/paragraf-49
          excerpt: afrundes til nærmeste kronebeløb, der kan deles med 12
  versions:
  - effective_from: '2024-10-21'
    formula: floor((amount_before_rounding / rounding_multiple_of_twelve) + ((rounding_multiple_of_twelve
      / rounding_multiple_of_twelve) / 2)) * rounding_multiple_of_twelve
