format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-11-a
    source_sha256: 5f35a64b34c3fbf2d5b22550c0f43d396ae1f6813243215a08cfc6cd1176a847
  summary: Til børn efter medlemmer af tillægspensionsordningen, der er født den 1.
    juli 1925 eller senere, og som dør den 1. juli 1992 eller senere, udbetales der
    ved dødsfaldet et engangsbeløb. Beløbet udgør for hvert barn under 18 år én gang
    den pensionsret i form af egenpension og bonuspension fra det 67. år, eventuelt
    reguleret efter § 9, stk. 1. Det udbetales til værgen for det eller de berettigede
    børn.
