- name: voluntary_atp_contribution_permitted
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: ATP-loven § 2 b, chapeau and nos. 1-4
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-2-b
          excerpt: kan efter eget ønske betale bidrag til Arbejdsmarkedets Tillægspension
            for perioder, hvor de modtager de nævnte ydelser
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-2-b
          excerpt: 1) Personer, der er medlem af en arbejdsløshedskasse, og som modtager
            overgangsydelse eller efterløn
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-2-b
          excerpt: 2) personer, der modtager fleksydelse efter lov om fleksydelse
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-2-b
          excerpt: 3) personer, der i medfør af § 74 o i lov om arbejdsløshedsforsikring
            m.v., modtager efterløn uden at være medlem af en dansk arbejdsløshedskasse
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-2-b
          excerpt: 4) personer, der er omfattet af lov om delpension
  versions:
  - effective_from: '2024-11-01'
    formula: '(person_is_member_of_unemployment_insurance_fund

      and (person_receives_transition_benefit

      or person_receives_early_retirement_benefit))

      or person_receives_flex_benefit

      or person_receives_early_retirement_benefit_without_danish_unemployment_insurance_fund_under_section_74_o

      or person_is_covered_by_partial_pension_act'
