format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-2-b
    source_sha256: fc9abc407e3ff844832dc7b32e802d50f133bb227838227638dc65eeaf96f66a
  summary: 'Følgende personer kan efter eget ønske betale bidrag til Arbejdsmarkedets
    Tillægspension for perioder, hvor de modtager de nævnte ydelser: 1) medlemmer
    af en arbejdsløshedskasse med overgangsydelse eller efterløn, 2) modtagere af
    fleksydelse, 3) modtagere af efterløn uden dansk arbejdsløshedskasse efter § 74
    o og 4) personer omfattet af lov om delpension.'
inputs:
- name: person_is_member_of_unemployment_insurance_fund
  entity: Person
  dtype: Boolean
  period: Month
- name: person_receives_transition_benefit
  entity: Person
  dtype: Boolean
  period: Month
- name: person_receives_early_retirement_benefit
  entity: Person
  dtype: Boolean
  period: Month
- name: person_receives_flex_benefit
  entity: Person
  dtype: Boolean
  period: Month
- name: person_receives_early_retirement_benefit_without_danish_unemployment_insurance_fund_under_section_74_o
  entity: Person
  dtype: Boolean
  period: Month
- name: person_is_covered_by_partial_pension_act
  entity: Person
  dtype: Boolean
  period: Month
