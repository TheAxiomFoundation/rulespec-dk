    formula: '3'
- name: severance_payment
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: ATP-loven § 24 j
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-24-j
          excerpt: Ved fratrædelsesgodtgørelse forstås enhver form for betaling
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-24-j
          excerpt: som ikke 1) udgør løn eller værdi af personalegoder i opsigelsesperioden
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-24-j
          excerpt: 2) udgør rimelig kompensation for påtagelse af konkurrenceklausuler
            eller kundeklausuler
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1142-2024/atp-loven/paragraf-24-j
          excerpt: 3) følger af præceptiv lovgivning
  versions:
  - effective_from: '2024-11-01'
    formula: 'payment_recipient_entitled_in_connection_with_termination

      and not payment_is_wages_during_notice_period

      and not payment_is_value_of_employee_benefits_during_notice_period

      and not payment_is_reasonable_compensation_for_non_compete_clause

      and not payment_is_reasonable_compensation_for_customer_clause

      and not payment_follows_mandatory_legislation'
