          excerpt: Retshandler, der afsluttes af den berettigede med hensyn til disse
            krav, er ugyldige.
  versions:
  - effective_from: '2024-11-01'
    formula: 'claim_is_for_benefits_under_this_act

      and entitled_person_has_concluded_legal_transaction_concerning_claim'
