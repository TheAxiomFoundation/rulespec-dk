format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-14-b
    source_sha256: b0d2223d3fe20c57636f48eb48dfa57d4afbd1451b2ebd45b1495b8c5c9823b0
  summary: 'Udbetaling efter § 15 af tilgodehavende feriemidler med regulering medregnes,

    når den hidrører fra ferie med løn eller feriegodtgørelse i feriekortordninger

    uden feriekasser. LG-indbetalte krav og afledte udbetalinger medregnes ikke.

    Arbejdsgiveren betaler en afgift på 38 pct. af et sådant krav, og § 38 finder

    ikke anvendelse på afgiften.'
inputs:
- name: payment_is_under_section_15
  entity: Payment
  dtype: Boolean
  period: Month
- name: payment_derives_from_holiday_with_wages
  entity: Payment
  dtype: Boolean
  period: Month
- name: payment_derives_from_holiday_compensation_in_feriekort_scheme_without_feriekasse
  entity: Payment
  dtype: Boolean
  period: Month
- name: payment_derives_from_lg_deposit_under_section_8_b
  entity: Payment
  dtype: Boolean
  period: Month
- name: qualifying_holiday_funds_payment_amount
  entity: Payment
  dtype: Money
  period: Month
  unit: DKK
- name: employer_has_claim_deposited_by_lg_under_section_8_b
  entity: Employer
  dtype: Boolean
  period: Month
- name: claim_deposited_by_lg_under_section_8_b_amount
  entity: Employer
  dtype: Money
