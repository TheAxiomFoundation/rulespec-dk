rules:
- name: payment_is_includable_in_taxable_income
  kind: derived
  entity: Payment
  dtype: Judgment
  period: Month
  source: Pensionsbeskatningsloven § 14 B, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-14-b
          excerpt: i det omfang de hidrører fra ferie med løn eller feriegodtgørelse
            i feriekortordninger uden feriekasser
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-14-b
          excerpt: Udbetalinger af tilgodehavende feriemidler, der hidrører fra en
            indbetaling som nævnt i 1. pkt., medregnes ikke ved opgørelsen af lønmodtagerens
            skattepligtige indkomst.
  versions:
  - effective_from: '2024-11-26'
    formula: 'payment_is_under_section_15

      and

      (payment_derives_from_holiday_with_wages

      or payment_derives_from_holiday_compensation_in_feriekort_scheme_without_feriekasse)

      and

      not payment_derives_from_lg_deposit_under_section_8_b'
- name: taxable_income_inclusion_from_holiday_funds_payment
  kind: derived
  entity: Payment
  dtype: Money
  period: Month
  unit: DKK
  source: Pensionsbeskatningsloven § 14 B, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-14-b
          excerpt: medregnes ved opgørelsen af den skattepligtige indkomst
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-14-b
          excerpt: Øvrige udbetalinger efter § 15 i lov om forvaltning og administration
            af tilgodehavende feriemidler medregnes ikke ved opgørelsen af den skattepligtige
            indkomst.
  versions:
  - effective_from: '2024-11-26'
    formula: 'if payment_is_includable_in_taxable_income: qualifying_holiday_funds_payment_amount
      else: 0'
