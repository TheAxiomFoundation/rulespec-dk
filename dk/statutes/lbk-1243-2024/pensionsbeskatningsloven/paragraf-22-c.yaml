        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-22-c
          excerpt: uden at dette betragtes som en afgiftspligtig udbetaling
      - path: versions[0].formula
        kind: condition
        source:
