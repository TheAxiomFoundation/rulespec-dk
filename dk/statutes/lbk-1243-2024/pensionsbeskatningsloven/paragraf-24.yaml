  summary: '"Ved opgørelsen af en arbejdsgivers skattepligtige indkomst medregnes
    beløb" under the stated § 17, stk. 1, nr. 1-6 reservation or tax-free repayment
    paths, where the employer deducted contributions to the arrangement.'
