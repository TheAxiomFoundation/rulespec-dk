- name: tax_free_repayment_amount_under_section_22_f_subsection_1
  entity: Employer
  dtype: Money
  period: Year
rules:
- name: taxable_income_inclusion
  kind: derived
  entity: Employer
  dtype: Money
  period: Year
  source: Pensionsbeskatningsloven § 24.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-24
          excerpt: 1, når arbejdsgiveren ved opgørelsen af den skattepligtige indkomst
            har fradraget sine indbetalinger til ordningen.
      - path: versions[0].formula
        kind: condition
        source:
