  - effective_from: '2024-11-26'
    formula: '0.40'
- name: foreign_deduction_eligible_payout_amount
  kind: derived
  entity: Payment
  dtype: Money
  period: Year
  source: Pensionsbeskatningsloven § 28, stk. 2, 2. og 4. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
          excerpt: Ved deludbetaling fra en ordning anses udbetalingen fortrinsvis
            at vedrøre indbetalinger, for hvilke der i udlandet har været hel eller
            delvis fradrags- eller bortseelsesret.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
          excerpt: udbetalte beløb, der modsvarer sådanne indbetalinger
  versions:
  - effective_from: '2024-11-26'
    formula: min(payout_amount, foreign_deduction_eligible_contributions_remaining)
- name: capital_insurance_payout_charge
  kind: derived
  entity: Payment
  dtype: Money
  period: Year
  source: Pensionsbeskatningsloven § 28, stk. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
          excerpt: Ved udbetaling fra en kapitalforsikring eller opsparing i pensionsøjemed
            i tilfælde, der ikke omfattes af §§ 25 og 27
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
          excerpt: en afgift på 52 pct. af det udbetalte beløb
  versions:
  - effective_from: '2024-11-26'
    formula: "if payout_is_from_capital_insurance_or_pension_savings and payout_not_covered_by_sections_25_and_27:\n\
      \  capital_insurance_payout_charge_rate * payout_amount\nelse: 0"
- name: age_savings_payout_charge
  kind: derived
  entity: Payment
  dtype: Money
  period: Year
  source: Pensionsbeskatningsloven § 28, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
          excerpt: Ved udbetaling fra en aldersopsparing og aldersforsikring i tilfælde,
            der ikke omfattes af § 25 A
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
          excerpt: Ved udbetaling efter den tidligere ejers død udgør afgiften som
            nævnt i 2. pkt. dog 40 pct.
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
          excerpt: Ved deludbetaling fra en ordning anses udbetalingen fortrinsvis
            at vedrøre indbetalinger
  versions:
  - effective_from: '2024-11-26'
    formula: 'if payout_is_from_age_savings_or_age_insurance and payout_not_covered_by_section_25_a:
      (if payout_is_after_former_owners_death: foreign_deduction_eligible_payout_after_death_charge_rate
      * foreign_deduction_eligible_payout_amount else: foreign_deduction_eligible_payout_charge_rate
      * foreign_deduction_eligible_payout_amount) + age_savings_standard_charge_rate
      * max(0, payout_amount - foreign_deduction_eligible_payout_amount) else: 0'
