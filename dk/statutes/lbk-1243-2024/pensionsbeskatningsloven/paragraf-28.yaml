- name: foreign_deduction_eligible_payout_after_death_charge_rate
  kind: parameter
  dtype: Rate
  source: Pensionsbeskatningsloven § 28, stk. 2, 3. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
