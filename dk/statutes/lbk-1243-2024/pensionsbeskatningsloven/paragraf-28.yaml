format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-28
    source_sha256: 9fdb821e2f870e7c6002fbaa2ad97444e17f8b1fa668b6185bfc01024219671b
  summary: '§ 28, stk. 1: payout from a capital insurance or pension savings arrangement
    not covered by §§ 25 and 27 is charged 52 pct. § 28, stk. 2: payout from an age
    savings or age insurance arrangement not covered by § 25 A is charged 20 pct.;
    the portion matching contributions with foreign full or partial deduction or exclusion
    is charged 60 pct., reduced to 40 pct. after the former owner''s death; partial
    payouts preferentially concern that foreign-deductible contribution portion.'
inputs:
- name: payout_is_from_capital_insurance_or_pension_savings
  entity: Payment
  dtype: Boolean
  period: Year
- name: payout_not_covered_by_sections_25_and_27
  entity: Payment
  dtype: Boolean
  period: Year
- name: payout_is_from_age_savings_or_age_insurance
  entity: Payment
  dtype: Boolean
  period: Year
- name: payout_not_covered_by_section_25_a
  entity: Payment
  dtype: Boolean
  period: Year
- name: payout_amount
  entity: Payment
  dtype: Money
  period: Year
- name: foreign_deduction_eligible_contributions_remaining
  entity: Payment
  dtype: Money
  period: Year
- name: payout_is_after_former_owners_death
  entity: Payment
  dtype: Boolean
  period: Year
rules:
