format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-29-b
    source_sha256: 9b6b9c2e47989afa19379dc6d5960320c95a2a37bda06a8938f4bb201681c26a
  summary: '"For udbetalinger af følgende engangsbeløb udgør afgiften 40 pct." Categories
    are capitalized ATP lump sums under the listed provisions, ATP lump sums under
    § 14 b, stk. 1, or § 14 e, stk. 1, and social-pension lump sums under the listed
    § 33 c-e provisions.'
