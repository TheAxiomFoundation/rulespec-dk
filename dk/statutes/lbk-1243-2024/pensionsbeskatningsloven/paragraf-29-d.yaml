format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-29-d
    source_sha256: e62b1ecda36fae47f73c2cb8eb386f3aa27051e87db199e3fe70a5f19f6c8021
  summary: Ved udbetaling af Særlig Pensionsopsparing efter § 17 j, stk. 2, svares
    35 pct. af den del, der ikke overstiger 15.000 kr., og 50 pct. af den del, der
    overstiger 15.000 kr.
inputs:
- name: payment_is_special_pension_savings_payment_under_section_17_j_subsection_2
  entity: Payment
  dtype: Boolean
  period: Month
- name: special_pension_savings_payment_amount
  entity: Payment
  dtype: Money
  unit: DKK
  period: Month
rules:
- name: lower_bracket_payment_limit
  kind: parameter
  dtype: Money
  unit: DKK
  source: Pensionsbeskatningsloven § 29 D, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-29-d
          excerpt: ikke overstiger 15.000 kr.
  versions:
  - effective_from: '2024-11-26'
    formula: '15000'
- name: upper_bracket_excess_threshold
  kind: parameter
  dtype: Money
  unit: DKK
  source: Pensionsbeskatningsloven § 29 D, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-29-d
          excerpt: overstiger 15.000 kr.
  versions:
  - effective_from: '2024-11-26'
    formula: '15000'
- name: lower_bracket_tax_rate
  kind: parameter
  dtype: Rate
  source: Pensionsbeskatningsloven § 29 D, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-29-d
          excerpt: en afgift på 35 pct.
  versions:
  - effective_from: '2024-11-26'
    formula: '0.35'
- name: upper_bracket_tax_rate
  kind: parameter
  dtype: Rate
  source: Pensionsbeskatningsloven § 29 D, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-29-d
          excerpt: en afgift på 50 pct.
  versions:
  - effective_from: '2024-11-26'
    formula: '0.50'
- name: special_pension_savings_payment_tax
  kind: derived
  entity: Payment
  dtype: Money
  unit: DKK
  period: Month
  source: Pensionsbeskatningsloven § 29 D.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-29-d
          excerpt: 35 pct. af den del af udbetalingen, der ikke overstiger 15.000
            kr. Af den del af udbetalingen, der overstiger 15.000 kr., svares en afgift
            på 50 pct.
  versions:
  - effective_from: '2024-11-26'
    formula: "if payment_is_special_pension_savings_payment_under_section_17_j_subsection_2:\n\
      \  (lower_bracket_tax_rate * min(special_pension_savings_payment_amount, lower_bracket_payment_limit))\n\
      \  + (upper_bracket_tax_rate * max(0, special_pension_savings_payment_amount\
      \ - upper_bracket_excess_threshold))\nelse: 0"
