format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1243-2024/pensionsbeskatningsloven/paragraf-30-a
    source_sha256: 0030faac225d9b8e2e91471f33a77b0b027903c77531009aebe58c6f2743158d
  summary: Ved puljeindlån kan beløb, der modsvarer et i puljen konstateret negativt
    afkast, overføres fra indlånskontoen til pengeinstituttet uden afgift eller indkomstskat
    for ejeren. Puljeindlån er indlån, hvor renten tilskrives på grundlag af afkastet
    af udskilte værdipapirer.
