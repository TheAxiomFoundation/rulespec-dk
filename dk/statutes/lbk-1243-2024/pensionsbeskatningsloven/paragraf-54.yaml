  summary: § 18 om fradragsret for forsikringspræmier m.v. gælder kun for personer,
    der er fuldt skattepligtige her i landet. Fradragsretten efter § 18 og § 49, stk.
    1, tilkommer ejeren uanset indbetaleren og er begrænset til forfaldne eller indbetalte
    præmier, mens ejeren er fuldt skattepligtig her i landet.
