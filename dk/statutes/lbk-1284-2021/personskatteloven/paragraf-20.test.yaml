    start: '2010-01-01'
    end: '2010-12-31'
  input:
    dk:statutes/lbk-1284-2021/personskatteloven/paragraf-20#input.income_year_is_within_historical_baseline_period: true
    dk:statutes/lbk-1284-2021/personskatteloven/paragraf-20#input.previous_regulation_number: 99.0
    dk:statutes/lbk-1284-2021/personskatteloven/paragraf-20#input.adjustment_percentage: -0.25
    dk:statutes/lbk-1284-2021/personskatteloven/paragraf-20#input.amount_before_regulation: 12345
