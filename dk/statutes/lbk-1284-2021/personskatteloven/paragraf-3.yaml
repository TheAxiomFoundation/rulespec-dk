  summary: '"Personlig indkomst omfatter alle de indkomster, der indgår i den skattepligtige
    indkomst, og som ikke er kapitalindkomst." Ved opgørelsen fradrages de elleve
    opregnede udgifts-, bidrags-, afskrivnings- og indskudskategorier.'
