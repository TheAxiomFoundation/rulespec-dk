- name: pension_contribution_deduction_in_share_income
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: DKK
  source: Personskatteloven § 4 a, stk. 4, 1.-3. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: En skattepligtig, der i forbindelse med afståelse af aktierne i
            et selskab, hvori den pågældende har været hovedaktionær
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: har oprettet en pensionsordning omfattet af pensionsbeskatningslovens
            § 15 A
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: vælge helt eller delvis at fradrage bidrag eller præmier til pensionsordningen
            i aktieindkomsten
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: Fradrag kan kun foretages, hvis aktieindkomsten opgjort efter stk.
            1 og 2 er positiv
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: fradraget kan ikke overstige aktieindkomsten opgjort efter stk.
            1 og 2
  versions:
  - effective_from: '2021-06-14'
    formula: "if taxpayer_has_disposed_of_shares_in_company_where_taxpayer_was_principal_shareholder\n\
      and pension_scheme_is_covered_by_pensionsbeskatningsloven_section_15_a\nand\
      \ taxpayer_elects_share_income_deduction_for_pension_contributions\nand share_income_before_pension_deduction\
      \ > 0:\n  min(pension_contributions_or_premiums_for_qualifying_pension_scheme,\
      \ share_income_before_pension_deduction)\nelse: 0"
- name: share_income_before_pension_deduction
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: DKK
  source: Personskatteloven § 4 a, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: Aktieindkomst omfatter det samlede beløb af
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: Stk. 1, nr. 1-4, omfatter ikke udbytter og fortjenester vedrørende
            aktier som nævnt i aktieavancebeskatningslovens § 19 C.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: Stk. 1 omfatter heller ikke udbytte efter ligningslovens § 16 A,
            stk. 5
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: udbetalinger og fortjenester vedrørende andele i medarbejderinvesteringsselskaber
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-4-a
          excerpt: Stk. 3. Uanset bestemmelserne i stk. 1 medregnes udlodninger, fortjenester
            og tab vedrørende aktier m.v. omfattet af aktieavancebeskatningslovens
            § 19 B dog til den personlige indkomst, hvis de ville være omfattet af
            aktieavancebeskatningslovens § 17, hvis de ikke var omfattet af samme
            lovs § 19 B.
  versions:
  - effective_from: '2021-06-14'
    formula: 'dividends_and_business_conversion_amount

      + business_conversion_amount_under_section_4_subsection_4_second_sentence

      + taxable_dividends_from_share_based_investment_companies_and_minimum_taxation_institutes

      + gains_and_losses_under_share_gain_tax_act_sections_12_to_14_and_section_19_b

      + reimbursed_investment_incentives_relating_to_specified_investment_certificates

      - dividends_and_gains_relating_to_shares_under_share_gain_tax_act_section_19_c

      - dividends_under_ligningsloven_section_16_a_subsection_5

      - employee_investment_company_payments_and_gains

      - section_19_b_amounts_reallocated_to_personal_income'
