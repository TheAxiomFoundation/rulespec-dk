format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1284-2021/personskatteloven/paragraf-9
    source_sha256: 798c30d57a52434a6a986eb2d22ad3a455abf5481d508f14f7282bf90e5f5614
  summary: Indkomstskatten efter §§ 6, 7, 7 a og 8 og § 8 a, stk. 2, nedsættes med
    skatteværdien af personfradrag. Værdien beregnet med § 8-procenten fragår først
    § 8 og derefter §§ 6, 7 og 7 a samt § 8 a, stk. 2; værdien beregnet med § 6-procenten
    fragår først § 6 og derefter §§ 8, 7 og 7 a samt § 8 a, stk. 2. § 8 c-skat, kommunal
    indkomstskat og kirkeskat nedsættes tilsvarende.
