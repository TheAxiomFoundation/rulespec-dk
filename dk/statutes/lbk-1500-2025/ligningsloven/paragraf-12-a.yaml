format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1500-2025/ligningsloven/paragraf-12-a
    source_sha256: 06d7646875314067e205835670640cd5424572d0ea5e10238a2bd1bfe8409ecb
  summary: § 12 A. Ejendomsværdiskat betales som ved ejerens egen beboelse, når boligen
    stilles til rådighed for ejerens eller ægtefællens forældre, stedforældre eller
    bedsteforældre. Kun lejebetaling over 250 pct. af ejendomsværdiskatten medregnes.
    Boligen skal ligge i tilknytning til ejerens eller ægtefællens bolig, og en slægtning
    skal have den angivne pensionsstatus. Stk. 2 sidestiller en samlever gennem de
    sidste to år med en ægtefælle.
