format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1500-2025/ligningsloven/paragraf-17
    source_sha256: 55c94895fd6caa9b5719082fb60e6b2b1e0ebd3cff4446e4253b90bf08307bb9
  summary: Renter af gæld kan ikke fradrages ved opgørelsen af den skattepligtige
    indkomst i det omfang, skyldneren som gave eller som arveforskud har påtaget sig
    gælden over for livsarvinger eller disses ægtefæller eller over for fonds, legater
    eller lignende, der helt eller delvis er oprettet til fordel for bestemte familier.
    Stedbørn og plejebørn sidestilles med livsarvinger.
