  summary: Udbetaling af VE-bonus fastsat i regler udstedt i medfør af § 13, stk.
    4, i lov om fremme af vedvarende energi medregnes ikke ved opgørelsen af den skattepligtige
    indkomst. Udbetaling af testcenterbonus fastsat i regler udstedt i medfør af §
    21, stk. 3, i lov om testcentre for store vindmøller ved Høvsøre og Østerild medregnes
    ikke ved opgørelsen af den skattepligtige indkomst.
