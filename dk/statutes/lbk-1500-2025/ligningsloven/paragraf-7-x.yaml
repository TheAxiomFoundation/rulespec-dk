format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-1500-2025/ligningsloven/paragraf-7-x
    source_sha256: 96e2b5e110cf05ffe15f4c3e0d268f0980c7b8c8b2a82729011e4fc8dbf69f3a
  summary: Til den skattepligtige indkomst medregnes ikke tilskud, der ydes og anvendes
    i henhold til lov om fremme af privat udlejningsbyggeri eller lov om støttede
    private ungdomsboliger. Ved opgørelse af fortjeneste og tab på fast ejendom, hvortil
    der er ydet sådant tilskud, anvendes anskaffelsessummen efter de almindelige regler
    fratrukket tilskuddet.
