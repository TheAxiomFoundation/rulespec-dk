          excerpt: Til den skattepligtige indkomst medregnes ikke tilskud, der ydes
            og anvendes
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-1500-2025/ligningsloven/paragraf-7-x
          excerpt: i henhold til lov om fremme af privat udlejningsbyggeri eller lov
