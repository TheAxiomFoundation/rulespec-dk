  source_verification:
    corpus_citation_path: dk/statute/lbk-1500-2025/ligningsloven/paragraf-8-t
    source_sha256: 1ee5f32047e75e2b6dcde0aee0b9be30799b258cde7cd647966c609e1fc1bef8
  summary: Der gives ikke fradrag for udgifter til cigaretter, røgtobak, cigarer,
    cerutter, cigarillos, cigaretpapir, skrå eller snus ydet som led i ansættelse
    eller afholdt til repræsentation eller reklame. Vareprøver fra registrerede tobaksvirksomheder
    til detailhandelen er undtaget.
