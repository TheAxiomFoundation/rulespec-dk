  source_verification:
    corpus_citation_path: dk/statute/lbk-1500-2025/ligningsloven/paragraf-9-b
    source_sha256: 6cb47f9074389e8472cedd3d47ce1ea29da197236d6a274a850e8afe8000b608
  summary: '§ 9 B, stk. 1: Befordring mellem sædvanlig bopæl og arbejdsplads kan fradrages
    i indtil 60 arbejdsdage inden for de forudgående 12 måneder; befordring mellem
    arbejdspladser og inden for samme arbejdsplads kan fradrages. Stk. 2 starter en
    ny 60-dages-periode efter 60 på hinanden følgende arbejdsdage. Stk. 3 indeholder
    en erhvervsmæssig formodning ved mange arbejdspladser og adgang til dokumentationspålæg
    i indtil 12 måneder. Stk. 4 regulerer skattefri befordringsgodtgørelse og fradrag
    ved kundeopsøgende aktiviteter for flere arbejdsgivere. Stk. 5 udvider reglerne
    til bestyrelsesmedlemmer og medhjælpere.'
