  summary: Støttetiden efter § 17 og slutlånstiden efter § 21 betragtes som brugt,
    selv om uddannelsesstøtte, der er udbetalt, kræves tilbage, fordi egenindkomsten
    overstiger årsfribeløbet eller uddannelsesfribeløbet.
