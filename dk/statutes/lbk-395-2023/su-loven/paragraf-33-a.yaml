  source_verification:
    corpus_citation_path: dk/statute/lbk-395-2023/su-loven/paragraf-33-a
    source_sha256: 6117316133cf15b095586ed987676b6f8aedab9b3e5bf61138028773b6d4634e
  summary: Restgæld under ordinær opkrævning concerning qualifying loans taken on
    1 January 1991 or later in a previous education period is repaid at the first
    disbursement in a new education period. A new study loan equals the new loan amount
    plus the repaid debt.
