format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-395-2023/su-loven/paragraf-8
    source_sha256: 9ac6d661dc959dbc13e7c49c9c848bb23ee7026bb2e24678269357cdfae8fb60
  summary: § 8. Det månedlige stipendium med udeboendesats udgør, medmindre det udbetales
    med dobbelt sats, højst 5.753 kr. (2013-niveau). Stk. 2 fastsætter 3.690 kr. for
    grundstipendium med udeboendesats uden for klippekortet for 18- og 19-årige. Stk.
    3 fastsætter 893 kr. for grundstipendium med hjemmeboendesats. Stk. 4 giver udeboendesats
    ved dokumenteret udeboende inden for klippekortet eller efter den måned, hvor
    den uddannelsessøgende fylder 20 år.
