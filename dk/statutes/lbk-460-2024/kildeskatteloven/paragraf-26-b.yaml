        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-460-2024/kildeskatteloven/paragraf-26-b
          excerpt: Aktiverne og passiverne anses for anskaffet henholdsvis påtaget
            af erhververen på samme tidspunkter, for samme beløb og med samme formål
            som de oprindelige anskaffelser m.m.
