format: rulespec/v1
rules:
- name: asset_transfer_covered
  kind: derived
  entity: Asset
  dtype: Judgment
  period: Year
  source: Kildeskatteloven § 26 B, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-460-2024/kildeskatteloven/paragraf-26-b
          excerpt: andre aktiver end de i § 26 A nævnte
  versions:
  - effective_from: '2024-05-03'
    formula: 'transferred_by_spouse_to_cohabiting_spouse

      and not asset_is_listed_in_section_26_a'
- name: asset_gain_or_loss_excluded_from_taxable_income
  kind: derived
  entity: Asset
  dtype: Money
  period: Year
  source: Kildeskatteloven § 26 B, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-460-2024/kildeskatteloven/paragraf-26-b
          excerpt: fortjeneste eller tab, som derved fremkommer, ikke medregnes ved
            opgørelsen af overdragerens skattepligtige indkomst
  versions:
  - effective_from: '2024-05-03'
    formula: 'max(0, (if asset_transfer_covered: gain_or_loss_arising_from_transfer
      else: 0))'
- name: liability_transfer_gain_or_loss_excluded_from_taxable_income
  kind: derived
  entity: Liability
  dtype: Money
  period: Year
  source: Kildeskatteloven § 26 B, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-460-2024/kildeskatteloven/paragraf-26-b
          excerpt: fortjeneste eller tab, som derved fremkommer, ikke medregnes ved
            opgørelsen af overdragerens skattepligtige indkomst
  versions:
  - effective_from: '2024-05-03'
    formula: 'max(0, (if liability_transfer_covered: gain_or_loss_arising_from_liability_transfer
      else: 0))'
- name: acquirer_deemed_to_have_same_asset_acquisition_time
