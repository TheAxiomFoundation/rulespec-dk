format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-460-2024/kildeskatteloven/paragraf-55
    source_sha256: 996cca142410926fc037e84e541eadc0bf499008590a62a17814ae65850c4728
  summary: '§ 55, stk. 1: Når allerede betalt foreløbig skat væsentligt må antages
    at overstige slutskatten med tillæg af eventuel overført restskat m.v. efter §
    61, stk. 3, og eventuel afgift efter pensionsbeskatningslovens § 25 A, stk. 5-9,
    og det er åbenbart urimeligt at afvente tilbagebetalingstidspunktet, tilbagebetales
    det for meget betalte beløb straks. Begæring skal fremsættes inden udgangen af
    opkrævningsåret. Stk. 2: Der ydes ikke renter.'
inputs:
- name: preliminary_tax_already_paid
  entity: Person
  dtype: Money
  period: Year
- name: projected_final_tax
  entity: Person
  dtype: Money
  period: Year
- name: transferred_restska_t_and_related_amounts_under_section_61_3
  entity: Person
  dtype: Money
  period: Year
- name: pension_tax_charge_under_section_25_a_5_to_9
  entity: Person
  dtype: Money
  period: Year
- name: preliminary_tax_excess_is_substantial
  entity: Person
  dtype: Boolean
  period: Year
- name: waiting_for_ordinary_repayment_is_manifestly_unreasonable
  entity: Person
  dtype: Boolean
  period: Year
- name: repayment_request_made_before_end_of_collection_calendar_year
  entity: Person
  dtype: Boolean
  period: Year
- name: amount_considered_overpaid_by_customs_and_tax_administration
  entity: Person
  dtype: Money
  period: Year
rules:
- name: final_tax_with_statutory_additions
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  source: § 55, stk. 1, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-460-2024/kildeskatteloven/paragraf-55
          excerpt: slutskatten med tillæg af eventuel overført restskat m.v. efter
            § 61, stk. 3, og af eventuel afgift omfattet af pensionsbeskatningslovens
            § 25 A, stk. 5-9
  versions:
  - effective_from: '2024-05-03'
