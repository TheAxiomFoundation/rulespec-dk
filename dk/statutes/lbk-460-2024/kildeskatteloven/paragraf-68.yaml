rules:
- name: missing_withholding_exists
  kind: derived
  entity: Person
  dtype: Judgment
  period: Day
  source: Kildeskatteloven § 68
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-460-2024/kildeskatteloven/paragraf-68
          excerpt: Er der ikke sket indeholdelse af A-skat eller arbejdsmarkedsbidrag
            i A-indkomst eller arbejdsmarkedsbidragspligtig indkomst som erhvervet
            af en her til landet skattepligtig person, eller er indeholdelse sket
            med for lavt beløb, skal erhververen straks indbetale det manglende beløb
            til det offentlige.
  versions:
  - effective_from: '2024-05-03'
    formula: "person_is_tax_liable_in_denmark\nand (\n  a_tax_or_labour_market_contribution_not_withheld_in_qualifying_income\n\
      \  or a_tax_or_labour_market_contribution_withheld_at_too_low_an_amount_in_qualifying_income\n\
      )"
