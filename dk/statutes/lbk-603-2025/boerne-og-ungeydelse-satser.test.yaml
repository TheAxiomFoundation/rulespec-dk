# Companion fixtures for the børne- og ungeydelsesloven § 1 base amounts
# and regulation mechanism (rulespec-dk#1). Amounts are the statutory
# 2011-niveau bases; the consumer_price_index_change_since_2009 input is
# a hypothetical mechanism input in these fixtures, NOT a captured CPI
# value (current-year regulated amounts enter only via a future
# dk/policies/ capture). The 2026 fixtures exercise the 24-krone
# rounding divisor (LOV nr 1642 af 16/12/2025); the 2025 fixture proves
# the version boundary with the original 12-krone divisor.

- name: base_amount_under_3_unregulated_2026
  period:
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_under_3_years_old: true
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_3_and_under_7_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_7_and_under_15_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.young_person_is_at_least_15_and_under_18_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.consumer_price_index_change_since_2009: 0
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2012_adjustment: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2013_or_later_adjustment: false
  output:
    # 16992 * 1.0, rounded to the nearest amount divisible by 24
    # (16992 = 24 * 708): unchanged.
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#annual_child_or_youth_benefit_amount_before_eligibility_rules: 16992
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#benefit_age_band: 0

- name: youth_amount_unregulated_2026
  period:
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_under_3_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_3_and_under_7_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_7_and_under_15_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.young_person_is_at_least_15_and_under_18_years_old: true
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.consumer_price_index_change_since_2009: 0
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2012_adjustment: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2013_or_later_adjustment: false
  output:
    # Ungeydelse base 10584 (= 24 * 441): unchanged at zero CPI change.
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#annual_child_or_youth_benefit_amount_before_eligibility_rules: 10584
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#benefit_age_band: 3

- name: regulated_amount_2026_divisor_24
  period:
    period_kind: tax_year
    start: '2026-01-01'
    end: '2026-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_under_3_years_old: true
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_3_and_under_7_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_7_and_under_15_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.young_person_is_at_least_15_and_under_18_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.consumer_price_index_change_since_2009: 0.25
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2012_adjustment: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2013_or_later_adjustment: true
  output:
    # 16992 * (1 + 0.25 - 0.039) = 16992 * 1.211 = 20577.312;
    # / 24 = 857.388 -> floor(857.888) = 857 -> * 24 = 20568.
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#annual_child_or_youth_benefit_amount_before_eligibility_rules: 20568

- name: regulated_amount_2025_divisor_12
  period:
    period_kind: tax_year
    start: '2025-06-01'
    end: '2025-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_under_3_years_old: true
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_3_and_under_7_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.child_is_at_least_7_and_under_15_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.young_person_is_at_least_15_and_under_18_years_old: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.consumer_price_index_change_since_2009: 0.25
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2012_adjustment: false
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#input.calendar_year_uses_2013_or_later_adjustment: true
  output:
    # Same inputs under the pre-2026 12-krone divisor:
    # 20577.312 / 12 = 1714.776 -> floor(1715.276) = 1715 -> * 12 = 20580
    # (differs from the 2026 fixture, proving divisor version selection).
    dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#annual_child_or_youth_benefit_amount_before_eligibility_rules: 20580

