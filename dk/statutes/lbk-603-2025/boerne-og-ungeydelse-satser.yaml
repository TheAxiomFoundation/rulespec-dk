format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_paths:
      - dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
      - dk/statute/lov-1642-2025/aendring-af-boerne-og-ungeydelsesloven-mv
  summary: >-
    Børne- og ungeydelsesloven (LBK nr 603 af 12/05/2025) § 1: a tax-free
    børneydelse of 16.992 kr. annually (2011-niveau) for children under 3,
    13.452 kr. (2011-niveau) for ages 3-6 and 10.584 kr. (2011-niveau) for
    ages 7-14 (stk. 1), and a tax-free ungeydelse of 10.584 kr. annually
    (2011-niveau) for ages 15-17 (stk. 2). Stk. 3 regulates the amounts by
    the Danmarks Statistik consumer price index relative to the 2009 index
    (annual average two years prior), with the computed percentage reduced
    by 1,9 percentage points for 2012 and 3,9 percentage points from 2013
    onward, and rounds to the nearest krone amount divisible by 12 - 24
    from 2026-01-01 per LOV nr 1642 af 16/12/2025 § 1, nr. 1 (commencement
    § 10, stk. 1). Stk. 3 also states a one-off 2023 uplift of 660 kr.
    "samlet" (combined) across the stk. 1-2 amounts; the statute does not
    allocate that combined uplift to individual amounts, so it is encoded
    as a grounded parameter but not applied in the per-person derivation
    (2023 predates this repo's 2026 validation year).
rules:
- name: annual_benefit_amount_at_2011_level
  kind: parameter
  dtype: Money
  unit: DKK
  indexed_by: benefit_age_band
  source: § 1, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].values
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
          excerpt: 16.992 kr. årligt (2011-niveau) ... 13.452 kr. ... 10.584 kr.
            ... Ungeydelsen udgør 10.584 kr.
  versions:
  - effective_from: '2025-05-12'
    values:
      0: 16992
      1: 13452
      2: 10584
      3: 10584
- name: adjustment_reduction_for_2012
  kind: parameter
  dtype: Rate
  source: § 1, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
          excerpt: Ved reguleringen for kalenderåret 2012 nedsættes ... med 1,9 procentenheder.
  versions:
  - effective_from: '2025-05-12'
    formula: '0.019'
- name: adjustment_reduction_from_2013
  kind: parameter
  dtype: Rate
  source: § 1, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
          excerpt: I 2013 og efterfølgende kalenderår nedsættes ... med 3,9 procentenheder.
  versions:
  - effective_from: '2025-05-12'
    formula: '0.039'
- name: exceptional_2023_benefit_increase
  kind: parameter
  dtype: Money
  unit: DKK
  source: § 1, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
          excerpt: I 2023 forhøjes de i stk. 1 og 2 nævnte beløb derudover samlet
            med 660 kr.
  versions:
  - effective_from: '2025-05-12'
    formula: '660'
- name: regulation_rounding_divisor
  kind: parameter
  dtype: Count
  source: § 1, stk. 3, 7. pkt. (12 through 2025; 24 from 2026-01-01 per LOV nr 1642
    af 16/12/2025 § 1, nr. 1)
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
          excerpt: De beløb, der fremkommer efter procentreguleringen, afrundes til
            nærmeste kronebeløb, der kan deles med 12.
      - path: versions[1].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lov-1642-2025/aendring-af-boerne-og-ungeydelsesloven-mv
          excerpt: 'I § 1, stk. 3, 7. pkt., ændres »12« til: »24«.'
      - path: versions[1].effective_from
        kind: effective_period
        source:
          corpus_citation_path: dk/statute/lov-1642-2025/aendring-af-boerne-og-ungeydelsesloven-mv
          excerpt: Loven træder i kraft den 1. januar 2026.
  versions:
  - effective_from: '2025-05-12'
    formula: '12'
  - effective_from: '2026-01-01'
    formula: '24'
- name: benefit_age_band
  kind: derived
  entity: Person
  dtype: Integer
  period: Year
  source: § 1, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
          excerpt: indtil det fyldte 3. år ... fra og med det fyldte 3. år og indtil
            det fyldte 7. år ... indtil det fyldte 15. år ... mellem 15 og 17 år
  versions:
  - effective_from: '2025-05-12'
    formula: 'if child_is_under_3_years_old: 0 else: if child_is_at_least_3_and_under_7_years_old:
      1 else: if child_is_at_least_7_and_under_15_years_old: 2 else: if young_person_is_at_least_15_and_under_18_years_old:
      3 else: -1'
- name: annual_child_or_youth_benefit_amount_before_eligibility_rules
  kind: derived
  entity: Person
  dtype: Money
  unit: DKK
  period: Year
  source: § 1, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven
          excerpt: Beløbene forhøjes eller nedsættes med samme procent ... De beløb,
            der fremkommer efter procentreguleringen, afrundes til nærmeste kronebeløb,
            der kan deles med 12.
      - path: versions[0].formula
        kind: import
        import:
          target: dk:statutes/lbk-603-2025/boerne-og-ungeydelse-satser#regulation_rounding_divisor
          output: regulation_rounding_divisor
          hash: sha256:local
  versions:
  - effective_from: '2025-05-12'
    formula: 'if benefit_age_band == -1: 0 else: (floor(((annual_benefit_amount_at_2011_level[benefit_age_band]
      * (1 + consumer_price_index_change_since_2009 - (if calendar_year_uses_2012_adjustment:
      adjustment_reduction_for_2012 else: if calendar_year_uses_2013_or_later_adjustment:
      adjustment_reduction_from_2013 else: 0))) / regulation_rounding_divisor)
      + 0.5) * regulation_rounding_divisor)'
