- name: reduction_is_two_percent_of_excess_over_regulated_allowance_in_2025
  period:
    period_kind: custom
    name: calendar_year
    start: '2025-05-12'
    end: '2025-12-31'
  input:
    dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis: 1117000
    ? dk:statutes/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a#input.personskatteloven_section_7_income_basis_after_section_14_recalculation
