format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
    source_sha256: 6ecaf404a44f4f898915c545fe41b2a09fd6f3028063a22a68f99029df119c2b
  summary: |-
    Den samlede børne- og ungeydelse nedsættes med 2 pct. af indtægtsgrundlaget over et bundfradrag på 700.000 kr. (2010-niveau). § 1 a, stk. 1 og 2, har virkning for grundlaget for mellemskat fra indkomståret 2026; den hidtidige affattelse anvendte grundlaget for topskat. Ydelsesmodtagerens kvalificerende pensionsindbetalinger fradrages efter begrænsning til grundbeløbet og omregning til bruttobeløb ved division med 0,6.
rules:
  - name: benefit_reduction_rate
    kind: parameter
    dtype: Rate
    source: § 1 a, stk. 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: 2 pct. af et indtægtsgrundlag
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: dk/statute/lbk-724-2022/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: 2 pct. af grundlaget for topskat
    versions:
      - effective_from: '2025-05-12'
        formula: |-
          0.02

  - name: statutory_income_reduction_threshold_2010_level
    kind: parameter
    dtype: Money
    unit: DKK
    source: § 1 a, stk. 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: bundfradrag på 700.000 kr. (2010-niveau)
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: dk/statute/lbk-724-2022/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: bundfradrag på 700.000 kr. (2010-niveau)
    versions:
      - effective_from: '2025-05-12'
        formula: |-
          700000

  - name: pension_contribution_gross_up_divisor
    kind: parameter
    dtype: Decimal
    source: § 1 a, stk. 4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: Beløbet omregnes til et bruttobeløb ved at dividere med 0,6.
    versions:
      - effective_from: '2025-05-12'
        formula: |-
          0.6

  - name: qualifying_pension_contributions_capped
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: DKK
    source: § 1 a, stk. 4-5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: kan ikke overstige det grundbeløb, der efter pensionsbeskatningslovens § 16, stk. 1, gælder for ydelsesmodtageren
    versions:
      - effective_from: '2025-05-12'
        formula: |-
          min(
            total_contributions_to_qualifying_pension_accounts,
            pension_contribution_limit_under_pensionsbeskatningsloven_section_16
          )

  - name: income_basis_for_benefit_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: DKK
    source: § 1 a, stk. 1, 2 og 4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: dk/statute/lbk-724-2022/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: grundlaget for topskat efter personskattelovens § 7, stk. 1 og 3
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: dk/statute/lbk-724-2022/boerne-og-ungeydelsesloven/paragraf-1-a
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: Beløbet omregnes til et bruttobeløb ved at dividere med 0,6.
          - path: versions[1].formula
            kind: formula
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: grundlaget for mellemskat efter personskattelovens § 7, stk. 1 og 3
          - path: versions[1].formula
            kind: condition
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
          - path: versions[1].formula
            kind: formula
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: Beløbet omregnes til et bruttobeløb ved at dividere med 0,6.
          - path: versions[1].effective_from
            kind: effective_period
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: har først virkning fra og med indkomståret 2026, for så vidt angår grundlaget for mellemskat
    versions:
      - effective_from: '2025-05-12'
        formula: |-
          (if person_only_taxable_part_of_year:
            personskatteloven_section_7_income_basis_after_section_14_recalculation
          else:
            personskatteloven_section_7_income_basis)
          - (qualifying_pension_contributions_capped / pension_contribution_gross_up_divisor)
      - effective_from: '2026-01-01'
        formula: |-
          (if person_only_taxable_part_of_year:
            personskatteloven_section_7_income_basis_after_section_14_recalculation
          else:
            personskatteloven_section_7_income_basis)
          - (qualifying_pension_contributions_capped / pension_contribution_gross_up_divisor)

  - name: annual_child_and_youth_benefit_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: DKK
    source: § 1 a, stk. 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: dk/statute/lbk-724-2022/boerne-og-ungeydelsesloven/paragraf-1-a
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1-a
              excerpt: overstiger et bundfradrag på 700.000 kr. (2010-niveau)
    versions:
      - effective_from: '2025-05-12'
        formula: |-
          benefit_reduction_rate
          * max(
            0,
            income_basis_for_benefit_reduction
            - statutory_income_reduction_threshold_2010_level
          )
