    versions:
      - effective_from: '2023-01-01'
        formula: |-
          2023

  - name: additional_annual_benefit_amount
    kind: parameter
    dtype: Money
    unit: DKK
    source: § 1, stk. 3, 9. pkt.
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
