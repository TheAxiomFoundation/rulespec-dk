          - path: versions[1].effective_from
            kind: effective_period
            source:
              corpus_citation_path: dk/statute/lov-1642-2025/aendring-af-boerne-og-ungeydelsesloven-mv/ikraftcentreretparagraf-10
              excerpt: Loven træder i kraft den 1. januar 2026.
    versions:
      - effective_from: '2012-01-01'
        formula: |-
          12
      - effective_from: '2026-01-01'
        formula: |-
          24

