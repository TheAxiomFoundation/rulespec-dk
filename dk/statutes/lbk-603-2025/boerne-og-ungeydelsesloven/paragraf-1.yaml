format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
    source_sha256: 2e135cac3ca5eb201b948ca915bf9554e864a09ebc8576c2603b6115730329ec
  summary: |-
    For børn under 15 år udbetales en skattefri børneydelse. For børn mellem 15 og 17 år udbetales en skattefri ungeydelse. Beløbene reguleres årligt efter forbrugerprisindekset, afrundes til nærmeste kronebeløb, der kan deles med 12, og forhøjes i 2023 derudover samlet med 660 kr.
