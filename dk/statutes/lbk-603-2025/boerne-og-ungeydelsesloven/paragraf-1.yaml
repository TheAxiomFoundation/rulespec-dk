  - name: benefit_age_band
    kind: derived
    entity: Person
    dtype: Integer
    period: Year
    source: § 1, stk. 1-2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
              excerpt: Børneydelsen udgør 16.992 kr. årligt (2011-niveau) for børn indtil det fyldte 3. år, 13.452 kr. årligt (2011-niveau) for børn fra og med det fyldte 3. år og indtil det fyldte 7. år og 10.584 kr. årligt (2011-niveau) for børn fra og med det fyldte 7. år og indtil det fyldte 15. år.
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
              excerpt: For børn mellem 15 og 17 år
    versions:
      - effective_from: '2012-01-01'
        formula: |-
          if child_age_years < early_childhood_age_upper_bound: 0 else: if child_age_years >= middle_childhood_age_lower_bound and child_age_years < middle_childhood_age_upper_bound: 1 else: if child_age_years >= later_childhood_age_lower_bound and child_age_years < childhood_age_upper_bound: 2 else: if child_age_years >= youth_age_lower_bound and child_age_years <= youth_age_upper_bound: 3 else: -1

  - name: annual_tax_free_child_or_youth_benefit
    kind: derived
    entity: Person
    dtype: Money
    unit: DKK
    period: Year
    source: § 1, stk. 1-3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
              excerpt: De i stk. 1 og 2 nævnte beløb reguleres årligt efter udviklingen i det af Danmarks Statistik offentliggjorte forbrugerprisindeks i forhold til indekset for 2009.
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
              excerpt: De beløb, der fremkommer efter procentreguleringen, afrundes til nærmeste kronebeløb, der kan deles med 12.
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
              excerpt: I 2023 forhøjes de i stk. 1 og 2 nævnte beløb derudover samlet med 660 kr.
    versions:
      - effective_from: '2012-01-01'
        formula: |-
          if benefit_age_band == -1: 0 else: floor(((annual_benefit_2011_level[benefit_age_band] * (1 + (percentage_change_rounded_to_one_decimal_place - cpi_adjustment_reduction_rate))) / benefit_rounding_multiple) + (1 / 2)) * benefit_rounding_multiple + (if payment_year_has_additional_statutory_increase: additional_annual_benefit_amount else: 0)
