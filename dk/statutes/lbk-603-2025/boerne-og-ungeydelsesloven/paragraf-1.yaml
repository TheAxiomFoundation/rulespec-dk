              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
              excerpt: Ved reguleringen for kalenderåret 2012 nedsættes den beregnede ændringsprocent efter 3. pkt. med 1,9 procentenheder.
          - path: versions[1].formula
            kind: parameter
            source:
              corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-1
