format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
    source_sha256: 5932ffa55798c79a1f656ab11032a06533fd32d6f0852e86305bff68d1c3a0d5
  summary: Retten til børne- og ungeydelsen er betinget af de angivne skatte-, opholds-,
    civilstands-, forsørgelses- og kommunale afgørelsesbetingelser. Er seksårsbetingelsen
    ikke opfyldt, udbetales en forholdsmæssig andel efter 6-66 måneders bopæl eller
    beskæftigelse inden for de seneste 10 år. Kortvarigt eller uddannelsesbetinget
    midlertidigt udlandsophold kan opfylde opholdsbetingelsen, dog ikke ved ulovligt
    skolefravær for undervisningspligtige børn.
