- name: child_presence_requirement_met
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 2, stk. 1, nr. 2, og stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: barnet faktisk opholder sig her i landet
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: Opholder barnet sig kortvarigt i udlandet
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: ulovligt skolefravær
  versions:
  - effective_from: '2025-05-12'
    formula: "child_actually_resides_in_denmark\nor (\n  (\n    child_is_short_term_abroad\n\
      \    or child_is_temporarily_abroad_for_education_to_improve_continued_residence_prospects\n\
      \  )\n  and (\n    not child_is_subject_to_compulsory_schooling\n    or not\
      \ child_has_unlawful_school_absence\n  )\n)"
- name: non_duration_entitlement_conditions_met
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 2, stk. 1, nr. 1-6 og 8-10
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: er fuldt skattepligtig efter kildeskattelovens § 1
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: barnet ikke har indgået ægteskab
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: ikke er anbragt uden for hjemmet
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: kommunalbestyrelsen ikke
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lov-1642-2025/aendring-af-boerne-og-ungeydelsesloven-mv/aendringcentreretparagraf-1
          excerpt: 'ændres »§ 155 c i lov om social service« til: »§ 134 i barnets
            lov«'
  versions:
  - effective_from: '2025-05-12'
    formula: 'caretaker_is_fully_tax_liable_under_kildeskatteloven_section_1

      and child_presence_requirement_met

      and not child_has_entered_marriage

      and not child_is_placed_outside_home_under_barnets_lov

      and not child_is_admitted_with_custodial_parent_to_residential_facility_under_barnets_lov

      and not child_is_otherwise_maintained_by_public_funds

      and not parental_injunction_noncompliance_stops_benefit_for_quarter

      and not youth_education_activity_noncompliance_stops_benefit_for_month

      and not dagtilbudsloven_section_12_decision_stops_child_benefit_for_quarter

      and not dagtilbudsloven_section_44_e_decision_stops_child_benefit_for_quarter

      and not municipal_item_10_decision_stops_benefit_for_quarter'
- name: child_or_youth_benefit_payment_entitlement
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 2, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: hvis betingelserne herfor i øvrigt er opfyldt
  versions:
  - effective_from: '2025-05-12'
    formula: "non_duration_entitlement_conditions_met\nand (\n  at_least_one_person_with_maintenance_duty_meets_full_residence_or_employment_requirement\n\
      \  or partial_entitlement_duration_band >= 0\n)"
- name: child_or_youth_benefit_payment_fraction
  kind: derived
  entity: Person
  dtype: Rate
  period: Month
  source: § 2, stk. 1-2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: udbetales følgende forholdsmæssige andel af ydelsen
  versions:
  - effective_from: '2025-05-12'
    formula: 'if not non_duration_entitlement_conditions_met: 0 else:

      if at_least_one_person_with_maintenance_duty_meets_full_residence_or_employment_requirement:
      1 else:

      if partial_entitlement_duration_band == -1: 0 else:

      partial_entitlement_rate[partial_entitlement_duration_band]'
