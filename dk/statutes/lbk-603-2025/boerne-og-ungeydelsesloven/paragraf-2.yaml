- name: residence_or_employment_month_band
  kind: derived
  entity: Person
  dtype: Integer
  period: Month
  source: § 2, stk. 2, nr. 1-11
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: Efter 6 måneders bopæl eller beskæftigelse her i riget inden for
            de seneste 10 år
  versions:
  - effective_from: '2025-05-12'
    formula: 'if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[10]:
      10

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[9]:
      9

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[8]:
      8

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[7]:
      7

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[6]:
      6

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[5]:
      5

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[4]:
      4

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[3]:
      3

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[2]:
      2

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[1]:
      1

      else: if residence_or_employment_months_within_last_ten_years >= residence_or_employment_month_threshold[0]:
      0

      else: -1'
- name: child_residence_requirement_met
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 2, stk. 1, nr. 2, og stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: barnet faktisk opholder sig her i landet
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: Opholder barnet sig kortvarigt i udlandet
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: finder 1. pkt. ikke anvendelse, hvis der er tale om ulovligt skolefravær
  versions:
  - effective_from: '2025-05-12'
    formula: "child_actually_resides_in_denmark\nor (\n  (child_is_temporarily_abroad\
      \ or child_is_temporarily_abroad_for_qualifying_education)\n  and (\n    not\
      \ child_is_subject_to_compulsory_education\n    or not child_has_unlawful_school_absence\n\
      \  )\n)"
- name: child_and_youth_benefit_available
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 2, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: Retten til børne- og ungeydelsen er betinget af
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: hvis betingelserne herfor i øvrigt er opfyldt
  versions:
  - effective_from: '2025-05-12'
    formula: "caregiver_is_fully_tax_liabile_under_kildeskatteloven_section_1\nand\
      \ child_residence_requirement_met\nand child_has_not_entered_marriage\nand child_is_not_placed_outside_home_under_barnets_lov\n\
      and child_is_not_in_residential_measure_with_custody_holder\nand child_is_not_otherwise_maintained_by_public_funds\n\
      and municipality_has_not_notified_parental_order_noncompliance_payment_stop\n\
      and municipality_has_not_notified_youth_activity_noncompliance_payment_stop\n\
      and (\n  residence_or_employment_requirement_of_six_years_met\n  or residence_or_employment_month_band\
      \ >= 0\n)\nand municipality_has_not_notified_daycare_section_12_payment_stop\n\
      and municipality_has_not_notified_daycare_section_44_e_payment_stop\nand municipality_has_not_notified_social_service_payment_stop"
- name: child_and_youth_benefit_payment_share
  kind: derived
  entity: Person
  dtype: Rate
  period: Month
  source: § 2, stk. 1, nr. 7, og stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
          excerpt: udbetales følgende forholdsmæssige andel af ydelsen
  versions:
  - effective_from: '2025-05-12'
    formula: 'if residence_or_employment_requirement_of_six_years_met: 1

      else: if residence_or_employment_month_band >= 0: partial_benefit_rate[residence_or_employment_month_band]

      else: 0'
