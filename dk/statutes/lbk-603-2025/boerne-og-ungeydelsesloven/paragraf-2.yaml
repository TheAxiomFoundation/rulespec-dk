format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
    source_sha256: 5932ffa55798c79a1f656ab11032a06533fd32d6f0852e86305bff68d1c3a0d5
  summary: 'Retten til børne- og ungeydelse afhænger af § 2, stk. 1''s betingelser.
    Når ingen

    person med forsørgelsespligt opfylder seksårskravet, følger den forholdsmæssige

    andel den højeste bopæls- eller beskæftigelsesoptjening blandt disse personer

    inden for de seneste 10 år. Kortvarige og bestemte uddannelsesophold i udlandet

    kan opfylde opholdsbetingelsen, undtagen ved ulovligt skolefravær for

    undervisningspligtige børn.'
