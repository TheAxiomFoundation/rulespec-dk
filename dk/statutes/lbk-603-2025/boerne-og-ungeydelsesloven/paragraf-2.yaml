format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-2
    source_sha256: 5932ffa55798c79a1f656ab11032a06533fd32d6f0852e86305bff68d1c3a0d5
  summary: Retten til børne- og ungeydelsen er betinget af stk. 1's betingelser. Hvis
    seksårskravet i stk. 1, nr. 7, ikke er opfyldt, fastsætter stk. 2 en forholdsmæssig
    andel efter 6-66 måneders bopæl eller beskæftigelse. Stk. 3 tillader ydelse under
    visse midlertidige udlandsophold, men ikke ved ulovligt skolefravær for undervisningspligtige
    børn.
rules:
