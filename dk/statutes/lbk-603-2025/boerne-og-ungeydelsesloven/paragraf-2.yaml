      7 else:

      if residence_or_employment_months_in_lookback >= partial_entitlement_duration_lower_bound[6]:
      6 else:

      if residence_or_employment_months_in_lookback >= partial_entitlement_duration_lower_bound[5]:
      5 else:

      if residence_or_employment_months_in_lookback >= partial_entitlement_duration_lower_bound[4]:
      4 else:

      if residence_or_employment_months_in_lookback >= partial_entitlement_duration_lower_bound[3]:
      3 else:

      if residence_or_employment_months_in_lookback >= partial_entitlement_duration_lower_bound[2]:
      2 else:

      if residence_or_employment_months_in_lookback >= partial_entitlement_duration_lower_bound[1]:
      1 else:

      if residence_or_employment_months_in_lookback >= partial_entitlement_duration_lower_bound[0]:
      0 else: -1'
