    formula: 'if not child_or_youth_benefit_payment_entitlement: 0 else:

      if at_least_one_person_with_maintenance_duty_meets_full_residence_or_employment_requirement:
      1 else:

      partial_entitlement_rate[partial_entitlement_duration_band]'
