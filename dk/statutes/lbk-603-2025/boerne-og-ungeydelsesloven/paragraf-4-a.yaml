        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
          excerpt: 4, i lov om pas til danske statsborgere m.v., eller ophæves den
            under en efterfølgende domstolsprøvelse, efterbetales børne- og ungeydelsen,
