format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
    source_sha256: 07c8c623bc87641d3df36a0eb1b53f3c88138f04fe4d423f0090ff5af03d9850
  summary: Udbetaling ophører ved politiets pasinddragelse efter paslovens § 2, stk.
    1, nr. 4. Børneydelse ophører fra næste kvartal og ungeydelse fra næste måned.
    Ydelsen omdirigeres til den person, barnet bor hos, eller efter Udbetaling Danmarks
    skøn til barnet. Omgørelse eller ophævelse giver ikke efterbetaling. Fornyet udbetaling
    kræver dokumenteret fremmøde hos politiet.
rules:
- name: passport_withdrawal_stops_benefit_payment
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 4 a, stk. 1, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
          excerpt: hvis politiet træffer afgørelse om inddragelse af ydelsesmodtagerens
            pas
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
          excerpt: i medfør af § 2, stk. 1, nr. 4, i lov om pas til danske statsborgere
            m.v.
  versions:
  - effective_from: '2025-05-12'
    formula: police_has_withdrawn_recipient_passport_under_passport_act_section_2_subsection_1_number_4
- name: child_benefit_payment_ceases_from_following_quarter
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 4 a, stk. 1, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
          excerpt: fra det kvartal, der følger efter det kvartal
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
          excerpt: hvor ydelsesmodtageren har fået inddraget sit pas
  versions:
  - effective_from: '2025-05-12'
    formula: 'police_has_withdrawn_recipient_passport_under_passport_act_section_2_subsection_1_number_4

      and current_quarter_follows_quarter_of_passport_withdrawal'
