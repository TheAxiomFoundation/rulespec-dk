format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
    source_sha256: 07c8c623bc87641d3df36a0eb1b53f3c88138f04fe4d423f0090ff5af03d9850
  summary: Udbetaling til ydelsesmodtageren ophører efter politiets pasinddragelse
    efter paslovens § 2, stk. 1, nr. 4. Børneydelse ophører fra næste kvartal og ungeydelse
    fra næste måned. Ydelsen omdirigeres til den person, barnet bor hos, med mulighed
    for betaling til barnet. Der sker ikke efterbetaling ved omgørelse eller domstolsophævelse.
    Fornyet betaling kræver dokumenteret fremmøde hos politiet i Danmark.
rules:
- name: passport_withdrawal_stops_recipient_payment
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 4 a, stk. 1, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
          excerpt: hvis politiet træffer afgørelse om inddragelse af ydelsesmodtagerens
            pas
  versions:
  - effective_from: '2025-05-12'
    formula: police_has_withdrawn_recipient_passport_under_passport_act_section_2_subsection_1_item_4
- name: child_benefit_payment_stops_next_quarter
