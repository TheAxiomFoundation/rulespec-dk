- name: redirected_benefit_ends_when_recipient_payment_resumes
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 4 a, stk. 4, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-a
          excerpt: Stk. 4. Er udbetalingen ophørt efter stk. 1, er det en betingelse
            for fornyet udbetaling af børne- og ungeydelse til ydelsesmodtageren,
            som der er truffet afgørelse om pasinddragelse mod som nævnt i stk. 1,
            at denne har dokumenteret sin tilstedeværelse i Danmark ved fremmøde hos
            politiet. Udbetaling efter stk. 2 ophører, når ydelsesmodtageren, som
            der er truffet afgørelse om pasinddragelse mod som nævnt i stk. 1, opnår
            fornyet udbetaling efter 1. pkt.
  versions:
  - effective_from: '2025-05-12'
    formula: 'redirected_benefit_is_being_paid_under_subsection_2

      and recipient_payment_may_resume_after_police_attendance'
