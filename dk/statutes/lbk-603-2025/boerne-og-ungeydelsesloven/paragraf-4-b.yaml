format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-b
    source_sha256: 8d5cb1008f3004081a7666335b9e726c1a6898e337058c51aa9907b32ddcb563
  summary: »Udbetaling af børne- og ungeydelse ophører, hvis politiet træffer afgørelse
    om pasinddragelse mod barnet« efter paslovens § 2, stk. 1, nr. 4. Børneydelse
    ophører fra det følgende kvartal og ungeydelse fra den følgende måned. Ved omgjort
    eller domstolsophævet afgørelse efterbetales den ikke-udbetalte ydelse, hvis de
    øvrige betingelser var opfyldt. Fornyet udbetaling kræver dokumenteret tilstedeværelse
    i Danmark ved fremmøde hos politiet.
