format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-c
    source_sha256: aa92cab270b97deb9ef7df92dc2f1eb7bdb4a3702d3b152424f17b237bb7f5ae
  summary: '"Der skal ske tilbagebetaling af børne- og ungeydelse udbetalt for en
    periode" når ydelsesmodtageren eller barnet ved endelig dom er omfattet af de
    nævnte strafbare forhold. Udbetaling Danmark træffer afgørelse om tilbagebetaling
    til personen. Efter tilbagebetaling efter stk. 1, 1. pkt., udbetales ydelsen for
    perioden til den person, som barnet bor hos, og Udbetaling Danmark kan bestemme
    udbetaling til barnet selv, hvis det skønnes bedst for barnet.'
