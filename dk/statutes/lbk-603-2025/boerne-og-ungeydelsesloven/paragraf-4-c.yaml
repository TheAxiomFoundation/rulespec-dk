          excerpt: Er der sket tilbagebetaling efter stk. 1, 1. pkt.
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-c
          excerpt: hvis det skønnes bedst for barnet
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-c
          excerpt: børne- og ungeydelsen skal udbetales til barnet selv
  versions:
  - effective_from: '2025-05-12'
    formula: 'repayment_has_occurred_under_subsection_1

      and benefit_recipient_has_final_judgment_for_listed_offence

      and payment_is_for_period_of_listed_conviction

      and agency_determines_payment_to_child_is_best_for_child'
