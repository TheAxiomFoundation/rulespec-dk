- name: payment_redirected_to_other_parental_authority_holder
  kind: derived
  entity: Person
  dtype: Judgment
  source: § 4 e, stk. 2, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
