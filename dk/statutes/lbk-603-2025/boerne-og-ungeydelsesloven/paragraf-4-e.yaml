    formula: 'benefit_payment_disqualification_applies

      and person_has_completed_custodial_sentence

      and disqualification_period_has_elapsed

      and not payment_rule_under_section_4_subsection_5_applies

      and not foster_care_payment_rule_under_section_4_subsection_7_applies'
