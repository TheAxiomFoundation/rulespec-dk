format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
    source_sha256: f66738bfa034420caf74713a762e4fafa78ba44d1274ebe6c7efb363926f50dd
  summary: § 4 e finder ikke anvendelse for domme om forhold begået inden 1. juli
    2024. Ved endelig dom for en overtrædelse omfattet af straffelovens § 81 a ophører
    udbetalingen i 3 år efter udstået frihedsberøvende straf. Børneydelse ophører
    fra det følgende kvartal og ungeydelse fra den følgende måned. Stk. 2-4 regulerer
    omdirigering, tilbagebetaling og automatisk genoptagelse.
rules:
- name: disqualification_period_years
  kind: parameter
  dtype: Integer
  source: § 4 e, stk. 1, 2.-3. pkt., og stk. 4, 2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: en periode på 3 år
  versions:
  - effective_from: '2024-06-11'
    formula: '3'
- name: alternative_recipient_paragraph_marker
  kind: parameter
  dtype: Integer
  source: § 4 e, stk. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: Stk. 2.
  versions:
