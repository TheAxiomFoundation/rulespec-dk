- name: repayment_decision_is_required
  kind: derived
  entity: Person
  dtype: Judgment
  source: § 4 e, stk. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: skal træffe afgørelse om tilbagebetaling af børne- og ungeydelse
            udbetalt til den dømte
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
