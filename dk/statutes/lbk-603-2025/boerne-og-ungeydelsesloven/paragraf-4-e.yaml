    formula: '2'
- name: foster_care_payment_cross_reference_subsection
  kind: parameter
  dtype: Integer
  source: § 4 e, stk. 2, 1. pkt., og stk. 4, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: jf. § 4, stk. 7
  versions:
  - effective_from: '2024-06-11'
    formula: '7'
- name: conviction_is_excluded_by_offence_date
  kind: derived
  entity: Person
  dtype: Judgment
  source: § 4 e, stk. 1, 1. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: finder ikke anvendelse for domme, der vedrører forhold begået inden
            1. juli 2024
  versions:
  - effective_from: '2024-06-11'
    formula: offence_was_committed_before_cutoff_date
- name: benefit_payment_disqualification_applies
  kind: derived
  entity: Person
  dtype: Judgment
  source: § 4 e, stk. 1, 1.-2. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: ved endelig dom er idømt ubetinget fængselsstraf eller anden strafferetlig
            retsfølge af frihedsberøvende karakter
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: overtrædelse, der er omfattet af straffelovens § 81 a
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: finder ikke anvendelse for domme, der vedrører forhold begået inden
            1. juli 2024
  versions:
  - effective_from: '2024-06-11'
    formula: 'conviction_is_final

      and sentence_is_unconditional_imprisonment_or_other_custodial_consequence

      and offence_is_covered_by_penal_code_section_81_a

      and not conviction_is_excluded_by_offence_date'
- name: benefit_payment_cessation_period_active
  kind: derived
  entity: Person
  dtype: Judgment
  source: § 4 e, stk. 1, 2.-3. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: Perioden i 1. pkt. regnes fra det tidspunkt, hvor personen har
            udstået fængselsstraf
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-4-e
          excerpt: en periode på 3 år
  versions:
  - effective_from: '2024-06-11'
    formula: 'benefit_payment_disqualification_applies

      and person_has_completed_custodial_sentence

      and current_period_is_within_disqualification_period'
- name: child_benefit_payment_ceases_from_following_quarter
  kind: derived
