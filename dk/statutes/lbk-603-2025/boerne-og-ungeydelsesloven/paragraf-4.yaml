  summary: |-
    »For forældremyndighedsindehavere med fælles forældremyndighed over barnet udbetales børne- og ungeydelsen med halvdelen til hver af forældremyndighedsindehaverne, jf. dog stk. 10.« Bestemmelsen regulerer modtagerfordeling (ligedeling, dokumentationsveje, eneforældremyndighed), udbetaling ved indsættelse i institution under Kriminalforsorgen, privat familiepleje, EU-koordinering (forordning 883/2004) og virkningstidspunkter for udbetaling. Recipient-routing mellem personer — ikke personberegnelig ret; stk. 1's ligedelingsaritmetik er kodet i composed/boerne-og-ungeydelse-couple-pipeline med atomer mod denne bestemmelse.
