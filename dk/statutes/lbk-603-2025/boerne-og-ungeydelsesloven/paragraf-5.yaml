- name: child_benefit_fifteenth_birthday_quarter_amount
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: DKK
  source: § 5, stk. 3, 4.-5. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
          excerpt: forholdsmæssig andel af et kvartals ydelse, der svarer til antallet
            af måneder
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
          excerpt: Beløbet afrundes til hele kroner
  versions:
  - effective_from: '2025-05-12'
    formula: "if child_turns_fifteen_in_current_quarter:\n  floor(\n    (\n      quarterly_child_benefit_amount\n\
      \      * months_from_quarter_start_through_fifteenth_birthday_month\n      /\
      \ months_in_current_quarter\n    ) + (1 / 2)\n  )\nelse: 0"
- name: youth_benefit_eighteenth_birthday_month_amount
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: DKK
  source: § 5, stk. 4, 4.-5. pkt.
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
          excerpt: forholdsmæssig andel af en måneds ydelse, der svarer til antallet
            af dage
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
          excerpt: Beløbet afrundes til hele kroner
  versions:
  - effective_from: '2025-05-12'
    formula: "if child_turns_eighteen_in_current_month:\n  floor(\n    (\n      monthly_youth_benefit_amount\n\
      \      * days_from_month_start_through_eighteenth_birthday\n      / days_in_current_month\n\
      \    ) + (1 / 2)\n  )\nelse: 0"
- name: improperly_received_benefit_repayment_required
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 5, stk. 5
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
          excerpt: Har nogen mod bedre vidende uberettiget modtaget børne- og ungeydelsen,
            skal beløbet tilbagebetales
  versions:
  - effective_from: '2025-05-12'
    formula: 'person_improperly_received_child_or_youth_benefit

      and person_knew_receipt_was_improper'
- name: improperly_received_benefit_repayment_amount
  kind: derived
  entity: Person
  dtype: Money
  period: Month
  unit: DKK
  source: § 5, stk. 5
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-5
          excerpt: skal beløbet tilbagebetales
  versions:
  - effective_from: '2025-05-12'
    formula: "if person_improperly_received_child_or_youth_benefit and person_knew_receipt_was_improper:\n\
      \  improperly_received_child_or_youth_benefit_amount\nelse: 0"
