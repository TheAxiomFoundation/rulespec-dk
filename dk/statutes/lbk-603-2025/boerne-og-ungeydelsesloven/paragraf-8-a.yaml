format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-8-a
    source_sha256: 9b411b66e51e65e70e779aa2e2cbb5105cc0a3095b3e4c2f603e6e9d3e20af6e
  summary: 'Ved kvartals- og månedsudbetalinger anvendes alene den seneste forskudsopgørelse

    til foreløbig nedsættelse, mens den endelige nedsættelse fastsættes alene efter

    årsopgørelsen. Regulering sker så vidt muligt ved modregning i eller tillæg til

    senere ydelser; uafregnede tilbagebetalingskrav opkræves af Udbetaling Danmark.

    Senere ændringer i årsopgørelsen kræver regulering af årets udbetalte ydelse.

    Nedsættelse og regulering kan ske uden partshøring.'
