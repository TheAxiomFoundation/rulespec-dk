    corpus_citation_path: dk/statute/lbk-603-2025/boerne-og-ungeydelsesloven/paragraf-8-a
    source_sha256: 9b411b66e51e65e70e779aa2e2cbb5105cc0a3095b3e4c2f603e6e9d3e20af6e
  summary: 'Ved hver kvartals- eller månedsudbetaling anvendes alene den seneste

    forskudsopgørelse til foreløbig nedsættelse. Den endelige nedsættelse og

    senere ændringer fastsættes efter årsopgørelsen. Regulering sker så vidt

    muligt ved modregning i eller tillæg til efterfølgende udbetalinger; et

    ikke-modregnet tilbagebetalingskrav opkræves af Udbetaling Danmark.

    Nedsættelse og regulering kan ske uden partshøring.'
