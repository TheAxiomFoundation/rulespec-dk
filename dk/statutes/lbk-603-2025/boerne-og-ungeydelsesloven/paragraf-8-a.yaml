          excerpt: Ved hvert kvartals eller måneds udbetaling af henholdsvis børneydelsen
            og ungeydelsen, jf. § 1, lægges udelukkende oplysningerne om modtagerens
            indkomst i den seneste leverede eller indhentede, jf. § 12, forskudsopgørelse
