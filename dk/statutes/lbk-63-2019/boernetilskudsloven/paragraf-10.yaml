      atoms:
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-63-2019/boernetilskudsloven/paragraf-10
          excerpt: Særligt børnetilskud, der skal ydes et barn efter en bidragsbetalers
            død, udbetales dog først fra udløbet af den periode, for hvilken der senest
            er udbetalt bidrag efter lov om børns forsørgelse.
      - path: versions[0].formula
        kind: condition
        source:
