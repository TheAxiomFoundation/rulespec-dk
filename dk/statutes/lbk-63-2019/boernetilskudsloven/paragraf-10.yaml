format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: dk/statute/lbk-63-2019/boernetilskudsloven/paragraf-10
    source_sha256: 7482f9f16502cfe8b9173956b4634308eccedc0d87bb03c27ac63ab0aaa37b1e
  summary: '"Børnetilskud udbetales første gang for det kvartal, der følger efter
    det kvartal, i hvilket retten til tilskuddet er erhvervet, og sidste gang for
    det kvartal, i hvilket retten til tilskuddet ophører." Særligt børnetilskud efter
    en bidragsbetalers død udbetales først fra udløbet af den periode, for hvilken
    der senest er udbetalt bidrag.'
