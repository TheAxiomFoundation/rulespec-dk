  source_verification:
    corpus_citation_path: dk/statute/lbk-63-2019/boernetilskudsloven/paragraf-17
    source_sha256: 80d21b1b6601e0e71a5020e344f0d8bbce5fdc9b947528c881471a989c1b44f6
  summary: '§ 17. Retten til at kræve et bidrag udbetalt forskudsvis vedvarer til
    og med årsdagen for bidragets forfaldsdag.

    Stk. 2. Hvis barnet forsørges af det offentlige, eller forældrene samlever, kan
    bidrag kun udbetales for tiden indtil den offentlige forsørgelses eller samlivets
    begyndelse.'
