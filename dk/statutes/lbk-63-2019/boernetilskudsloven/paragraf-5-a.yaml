          excerpt: i det omfang disse efter EU-retten er berettiget til ydelsen
  versions:
  - effective_from: '2019-01-21'
    formula: "other_conditions_for_benefit_are_met\nand (\n  child_is_entitled_to_benefit_under_eu_law\n\
      \  or person_with_maintenance_obligation_has_six_years_of_residence_or_employment\n\
      \  or maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation\
      \ >= first_partial_payment_month_threshold\n)"
- name: benefit_payment_fraction
  kind: derived
  entity: Person
  dtype: Rate
  period: Month
  source: § 5 a, stk. 1-3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: dk/statute/lbk-63-2019/boernetilskudsloven/paragraf-5-a
          excerpt: Hvis kravet i stk. 1 ikke er opfyldt, udbetales følgende forholdsmæssige
            andel af ydelsen
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: dk/statute/lbk-63-2019/boernetilskudsloven/paragraf-5-a
          excerpt: Stk. 1 og 2 gælder ikke for borgere fra EU, EØS eller Schweiz
  versions:
  - effective_from: '2019-01-21'
    formula: 'if child_is_entitled_to_benefit_under_eu_law: 1 else:

      if person_with_maintenance_obligation_has_six_years_of_residence_or_employment:
      1 else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= eleventh_partial_payment_month_threshold: eleventh_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= tenth_partial_payment_month_threshold: tenth_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= ninth_partial_payment_month_threshold: ninth_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= eighth_partial_payment_month_threshold: eighth_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= seventh_partial_payment_month_threshold: seventh_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= sixth_partial_payment_month_threshold: sixth_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= fifth_partial_payment_month_threshold: fifth_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= fourth_partial_payment_month_threshold: fourth_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= third_partial_payment_month_threshold: third_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= second_partial_payment_month_threshold: second_partial_payment_rate else:

      if maximum_months_of_residence_or_employment_for_person_with_maintenance_obligation
      >= first_partial_payment_month_threshold: first_partial_payment_rate else:

      0'
