    source_sha256: baee5fa231b5c3bb2556dcd8c7595cf156a4f435b19f3063e982284a1ff204d9
  summary: '"mindst en af de personer, der har forsørgelsespligt over for barnet,
    har haft bopæl eller beskæftigelse i mindst 6 år her i riget inden for de seneste
    10 år"; otherwise stk. 2 pays 8,3 pct. after 6 months through 91,7 pct. after
    66 months. Stk. 3 excludes EU, EØS and Swiss citizens entitled under EU law.'
