    source_sha256: 3825fd54f660c10e3707c7f74db84e78396b93629c83a5b8d0fcc2d7e5148dbd
  summary: '§ 6, stk. 1: "Ordinært børnetilskud efter § 2, nr. 1-3, ekstra børnetilskud
    efter § 3 og særligt børnetilskud efter § 4, stk. 3, nr. 1 og 6, samt § 5, stk.
    2, 2. pkt., udbetales efter ansøgning herom."


    Stk. 2: "Betingelserne for retten til at modtage børnetilskud skal være opfyldt
    ved begyndelsen af det første døgn i kvartalet."'
